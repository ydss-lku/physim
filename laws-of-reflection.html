<body><main>
<header><div><div class="eyebrow">S3 PHYSICS / OPTICS</div><h1>反射實驗室 <span>Laws of Reflection</span></h1></div><div class="header-actions"><button id="style-toggle" aria-pressed="false">風格：模擬</button><div class="views" role="group" aria-label="觀察角度"><button id="top" aria-pressed="false">鳥瞰</button><button id="free" aria-pressed="true">自由 3D</button></div></div></header>
<section class="stage" aria-label="反射實驗場景"><canvas id="scene" aria-label="三維平面鏡、量角器及可調方向的光線箱；可拖曳旋轉視角">請使用支援 Canvas 的瀏覽器。</canvas><div class="stage-title" id="view-name">自由 3D 視角</div><div class="legend"><span>入射線</span><span>反射線</span><span>法線</span></div><div class="hint" id="hint">拖曳畫面旋轉 · 滾輪或雙指縮放 · 鳥瞰可直接讀取刻度</div></section>
<footer class="controls"><button class="power" id="power" aria-pressed="true"><i class="lamp" aria-hidden="true"></i><span id="power-text">Ray box　開啟</span></button><div class="adjust"><label for="direction">移動 Ray box <span>光束始終對準鏡面中心</span></label><input id="direction" type="range" min="-80" max="80" value="-35" step="1" aria-label="Ray box 位置"><div class="ends"><span>左側</span><span>法線方向</span><span>右側</span></div></div><div class="note">量角器以法線為 0°，每小格 1°。<br>觀察光線與法線兩側的刻度。</div><div class="sr-only" id="status" aria-live="polite"></div></footer>

<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d');

const RAY_HEIGHT=.018, MIRROR_HEIGHT=2.8;

function polygon(points,fill,stroke){queue.push({z:points.reduce((s,p)=>s+project(p)[2],0)/points.length,draw(){ctx.beginPath();points.forEach((p,i)=>{const q=project(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);});ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}});}

 function syncLinks(){
