<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>反射實驗室 · Laws of Reflection</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f5;color:#172f3b;font-family:system-ui,'Microsoft JhengHei',sans-serif}main{height:100dvh;min-height:640px;display:flex;flex-direction:column}header{padding:23px 32px 18px;display:flex;align-items:center;justify-content:space-between;gap:20px;background:#fff;border-bottom:1px solid #dbe5e9}.eyebrow{font-size:11px;letter-spacing:2px;color:#567680;font-weight:700}h1{font-size:25px;margin:5px 0 0;font-weight:650}h1 span{font-size:14px;font-weight:400;color:#617984;margin-left:12px}.views{display:flex;padding:4px;border-radius:12px;background:#eef3f5;gap:4px}button{font:inherit;cursor:pointer;min-height:44px;padding:9px 17px;border:1px solid transparent;border-radius:9px;background:transparent;color:#47606c}button[aria-pressed=true]{background:#173e4a;color:white;box-shadow:0 2px 6px #12303c19}button:focus-visible,input:focus-visible{outline:3px solid #278aab;outline-offset:4px}.stage{position:relative;flex:1;min-height:350px;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}.stage-title{position:absolute;left:32px;top:22px;font-size:13px;color:#506f7b;pointer-events:none}.legend{position:absolute;right:32px;top:22px;display:flex;gap:20px;font-size:13px;color:#375561;pointer-events:none}.legend span:before{content:'';display:inline-block;width:23px;height:3px;background:#d95222;vertical-align:middle;margin-right:7px}.legend span:nth-child(2):before{background:#007f9b}.legend span:nth-child(3):before{height:0;border-top:2px dashed #647986;background:transparent}.hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:12px;color:#59727c;pointer-events:none}.controls{background:white;border-top:1px solid #dbe5e9;display:flex;align-items:center;gap:32px;padding:22px 32px}.power{min-width:174px;background:#eef3f5;text-align:left;display:flex;align-items:center;gap:12px}.lamp{width:10px;height:10px;border-radius:50%;background:#80949c}.power[aria-pressed=true] .lamp{background:#a3f0ba;box-shadow:0 0 10px #a3f0ba70}.adjust{flex:1;max-width:610px}.adjust label{display:flex;justify-content:space-between;gap:15px;font-size:14px;margin-bottom:10px}.adjust label span{font-size:12px;color:#758a92}input[type=range]{width:100%;accent-color:#176078;cursor:pointer}.ends{display:flex;justify-content:space-between;color:#71858d;font-size:11px;margin-top:3px}.note{margin-left:auto;max-width:230px;font-size:12px;color:#607883;line-height:1.65}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:720px){header{padding:16px;align-items:flex-start}h1{font-size:21px}h1 span{display:block;margin:4px 0 0;font-size:12px}.views button{padding:8px 11px;font-size:13px}.stage-title{left:16px;top:15px}.legend{left:16px;right:auto;top:42px;gap:14px;font-size:11px}.controls{padding:16px;gap:18px;flex-wrap:wrap}.power{min-width:145px}.adjust{min-width:180px}.note{display:none}main{min-height:650px}.hint{font-size:11px;padding:0 14px}}
.header-actions{display:flex;align-items:center;gap:12px}#style-toggle{border-color:#b7cbd4;background:#e9f0f3}#style-toggle[aria-pressed=true]{background:#173e4a}.realistic .stage{background:#121f29}.realistic .stage-title,.realistic .legend,.realistic .hint{color:#c4d3dc}.realistic .legend span:first-child:before,.realistic .legend span:nth-child(2):before{background:#ffd27a;box-shadow:0 0 7px #ffb747}@media(max-width:720px){.header-actions{flex-direction:column;gap:4px;align-items:stretch}#style-toggle{font-size:12px;min-height:34px;padding:5px}.legend{gap:12px}}
</style>
</head>
<body><main>
<header><div><div class="eyebrow">S3 PHYSICS / OPTICS</div><h1>反射實驗室 <span>Laws of Reflection</span></h1></div><div class="header-actions"><button id="style-toggle" aria-pressed="false">風格：模擬</button><div class="views" role="group" aria-label="觀察角度"><button id="top" aria-pressed="false">鳥瞰</button><button id="free" aria-pressed="true">自由 3D</button></div></div></header>
<section class="stage" aria-label="反射實驗場景"><canvas id="scene" aria-label="三維平面鏡、量角器及可調方向的光線箱；可拖曳旋轉視角">請使用支援 Canvas 的瀏覽器。</canvas><div class="stage-title" id="view-name">自由 3D 視角</div><div class="legend"><span>入射線</span><span>反射線</span><span>法線</span></div><div class="hint" id="hint">拖曳畫面旋轉 · 滾輪或雙指縮放 · 鳥瞰可直接讀取刻度</div></section>
<footer class="controls"><button class="power" id="power" aria-pressed="true"><i class="lamp" aria-hidden="true"></i><span id="power-text">Ray box　開啟</span></button><div class="adjust"><label for="direction">移動 Ray box <span>光束始終對準鏡面中心</span></label><input id="direction" type="range" min="-80" max="80" value="-35" step="1" aria-label="Ray box 位置"><div class="ends"><span>左側</span><span>法線方向</span><span>右側</span></div></div><div class="note">量角器以法線為 0°，每小格 1°。<br>觀察光線與法線兩側的刻度。</div><div class="sr-only" id="status" aria-live="polite"></div></footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d');
const state={on:true,realistic:false,angle:-35,top:false,yaw:-.18,elevation:.58,zoom:1};
const RAY_HEIGHT=.018, MIRROR_HEIGHT=2.8;
let W=1,H=1,scale=1,dirty=true,queue=[],reflectedPass=false;
const V={add:(a,b)=>a.map((x,i)=>x+b[i]),mul:(a,n)=>a.map(x=>x*n),dot:(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0)};
let right,up,depth;
function camera(){const y=state.top?0:state.yaw,e=state.top?Math.PI/2:state.elevation;right=[Math.cos(y),0,-Math.sin(y)];up=[Math.sin(y)*Math.sin(e),-Math.cos(e),Math.cos(y)*Math.sin(e)];depth=[-Math.sin(y)*Math.cos(e),-Math.sin(e),-Math.cos(y)*Math.cos(e)];scale=Math.min(W/11.9,(H-100)/7.3)*state.zoom;}
function project(p){if(reflectedPass)p=[p[0],p[1],-p[2]];const q=[p[0],p[1],p[2]-2];return [W/2+V.dot(q,right)*scale,H*.52+V.dot(q,up)*scale,V.dot(q,depth)];}
function polygon(points,fill,stroke){queue.push({z:points.reduce((s,p)=>s+project(p)[2],0)/points.length,draw(){ctx.beginPath();points.forEach((p,i)=>{const q=project(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);});ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}});}
function line(a,b,color,width=1,dash=[]){queue.push({z:(project(a)[2]+project(b)[2])/2,draw(){const p=project(a),q=project(b);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([]);}});}
function text(p,t,color='#385967',size=13){queue.push({z:project(p)[2]-.001,draw(){const q=project(p);ctx.font=`500 ${size}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;if(reflectedPass){ctx.save();ctx.translate(q[0],q[1]);ctx.scale(-1,1);ctx.fillText(t,0,0);ctx.restore();}else ctx.fillText(t,q[0],q[1]);}});}
function arc(radius,y,color,width){for(let d=-90;d<90;d+=2){const a=d*Math.PI/180,b=(d+2)*Math.PI/180;line([radius*Math.sin(a),y,radius*Math.cos(a)],[radius*Math.sin(b),y,radius*Math.cos(b)],color,width);}}
function ray(a,b,color){if(state.realistic){queue.push({z:(project(a)[2]+project(b)[2])/2,draw(){const p=project(a),q=project(b);ctx.save();ctx.lineCap='round';for(const [w,c,blur] of [[14,'#ffae2717',18],[7,'#ffbf4c55',10],[3,'#ffd579',5],[1.2,'#fff8df',0]]){ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.lineWidth=w;ctx.strokeStyle=c;ctx.shadowColor='#ffb940';ctx.shadowBlur=blur;ctx.stroke();}ctx.restore();}});return;}const steps=40;for(let i=0;i<steps;i++)line(V.add(a,V.mul(V.add(b,V.mul(a,-1)),i/steps)),V.add(a,V.mul(V.add(b,V.mul(a,-1)),(i+1)/steps)),color,2.7);const v=V.add(b,V.mul(a,-1)),n=Math.hypot(...v),u=V.mul(v,1/n),side=[u[2],0,-u[0]],tip=V.add(a,V.mul(v,.57)),base=V.add(tip,V.mul(u,-.22));polygon([tip,V.add(base,V.mul(side,.095)),V.add(base,V.mul(side,-.095))],color);}
function box(theta,showLabel=true){const radial=[Math.sin(theta),0,Math.cos(theta)],tangent=[Math.cos(theta),0,-Math.sin(theta)];const point=(x,y,z)=>V.add(V.add(V.mul(radial,4.12+z),V.mul(tangent,x)),[0,y,0]);const vertices=[point(-.28,0,-.38),point(.28,0,-.38),point(.28,0,.38),point(-.28,0,.38),point(-.28,.37,-.38),point(.28,.37,-.38),point(.28,.37,.38),point(-.28,.37,.38)];[[[0,1,5,4],'#263d4b'],[[1,2,6,5],'#34505f'],[[2,3,7,6],'#243d4b'],[[3,0,4,7],'#3f5c6a'],[[4,5,6,7],'#527282']].forEach(([face,c])=>polygon(face.map(i=>vertices[i]),c,'#203d4c'));polygon([point(-.065,.005,-.381),point(.065,.005,-.381),point(.065,.035,-.381),point(-.065,.035,-.381)],state.on?'#ffd496':'#10232c');for(let i=0;i<3;i++)line(point(-.17,.372,.04+i*.08),point(.17,.372,.04+i*.08),'#243f4f',2);if(showLabel)text(point(0,.05,.92),'Ray box',state.realistic?'#c6d6e0':'#304f5e',13);return point(0,RAY_HEIGHT,-.381);}
function flush(){queue.sort((a,b)=>b.z-a.z).forEach(o=>o.draw());queue=[];}
function surface(){
// Horizontal measuring surface. The reflecting face is z=0; its normal is the z axis.
polygon([[-5.1,-.002,-1.35],[5.1,-.002,-1.35],[5.1,-.002,5.05],[-5.1,-.002,5.05]],state.realistic?'#344550':'#e3ebef',state.realistic?'#455a68':'#d1dee4');
queue.sort((a,b)=>b.z-a.z).forEach(o=>o.draw());queue=[];
const plate=[[0,0,0]];for(let d=-90;d<=90;d+=2)plate.push([3.28*Math.sin(d*Math.PI/180),0,3.28*Math.cos(d*Math.PI/180)]);polygon(plate,state.realistic?'#726c59':'#fffcf0','#a59675');queue.forEach(o=>o.draw());queue=[];
arc(3.2,.006,'#a59270',1.2);arc(2.78,.006,'#d7c9ae',1);arc(.4,.006,'#d7c9ae',1);
for(let d=-90;d<=90;d++){const a=d*Math.PI/180,r=d%10===0?2.9:d%5===0?3.01:3.1;line([r*Math.sin(a),.009,r*Math.cos(a)],[3.2*Math.sin(a),.009,3.2*Math.cos(a)],d%10===0?state.realistic?'#f6e8c7':'#695d48':state.realistic?'#c2b695':'#998a70',d%10===0?1.4:.8);if(d%10===0)text([2.59*Math.sin(a),.014,(Math.abs(d)===90?.16:2.59*Math.cos(a))],Math.abs(d)+'°',state.realistic?'#f6e8c7':'#695d48',Math.max(10,Math.min(15,scale*.26)));}
flush();}
function mirrorPath(){const pts=[[-3.58,0,0],[3.58,0,0],[3.58,MIRROR_HEIGHT,0],[-3.58,MIRROR_HEIGHT,0]];ctx.beginPath();pts.forEach((p,i)=>{const q=project(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);});ctx.closePath();}
function apparatus(labels=true){const theta=state.angle*Math.PI/180,source=box(theta,labels),hit=[0,RAY_HEIGHT,0],end=[-4.52*Math.sin(theta),RAY_HEIGHT,4.52*Math.cos(theta)];if(state.on){ray(source,hit,'#d95222');ray(hit,end,'#007f9b');}flush();}
function draw(){camera();queue=[];ctx.clearRect(0,0,W,H);ctx.fillStyle=state.realistic?'#14232d':'#eef3f5';ctx.fillRect(0,0,W,H);surface();
for(let z=-.65;z<3.57;z+=.18)line([0,.015,z],[0,.015,z+.09],state.realistic?'#b2c6d1':'#708591',1.5);
text([0,.015,3.77],'法線 / Normal',state.realistic?'#c6d6e0':'#5d7581',12);flush();
const front=state.top||Math.cos(state.yaw)>=0;
// Finite, opaque mirror with a reflected world clipped to its front face.
polygon([[-3.58,0,-.10],[3.58,0,-.10],[3.58,MIRROR_HEIGHT,-.10],[-3.58,MIRROR_HEIGHT,-.10]],'#536b78','#57717e');
polygon([[-3.58,0,0],[3.58,0,0],[3.58,MIRROR_HEIGHT,0],[-3.58,MIRROR_HEIGHT,0]],state.realistic?'#8197a5':'#a9c9d8','#668c9f');
polygon([[-3.58,MIRROR_HEIGHT,0],[3.58,MIRROR_HEIGHT,0],[3.58,MIRROR_HEIGHT,-.10],[-3.58,MIRROR_HEIGHT,-.10]],'#deedf4','#7796a6');
for(const x of [-3.58,3.58])polygon([[x,0,0],[x,MIRROR_HEIGHT,0],[x,MIRROR_HEIGHT,-.10],[x,0,-.10]],'#91acba');flush();
if(state.realistic&&front&&!state.top){ctx.save();mirrorPath();ctx.clip();ctx.fillStyle='#243844';ctx.fill();reflectedPass=true;surface();apparatus(false);reflectedPass=false;const sheen=ctx.createLinearGradient(W*.25,0,W*.75,H);sheen.addColorStop(0,'#d9f0ff15');sheen.addColorStop(.5,'#d9f0ff04');sheen.addColorStop(1,'#d9f0ff20');ctx.fillStyle=sheen;mirrorPath();ctx.fill();ctx.restore();mirrorPath();ctx.strokeStyle='#c1d5df';ctx.lineWidth=2;ctx.stroke();}
// Back of the mirror must occlude real objects and rays, without hiding them outside its outline.
ctx.save();if(!front){ctx.beginPath();ctx.rect(0,0,W,H);const pts=[[-3.58,0,-.10],[3.58,0,-.10],[3.58,MIRROR_HEIGHT,-.10],[-3.58,MIRROR_HEIGHT,-.10]];pts.forEach((p,i)=>{const q=project(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);});ctx.closePath();ctx.clip('evenodd');}apparatus();ctx.restore();
text([0,MIRROR_HEIGHT+.22,-.15],front?'平面鏡 / Plane mirror':'鏡背',state.realistic?'#c6d6e0':'#3c606f',14);flush();
}
function invalidate(){dirty=true;}
function setView(top){state.top=top;$('top').setAttribute('aria-pressed',top);$('free').setAttribute('aria-pressed',!top);$('view-name').textContent=top?'鳥瞰 · 由法線開始讀取刻度':'自由 3D 視角';$('hint').textContent=top?'移動下方滑桿，觀察兩條光線通過的刻度':'拖曳畫面旋轉 · 滾輪或雙指縮放 · 鳥瞰可直接讀取刻度';invalidate();}
$('style-toggle').onclick=()=>{state.realistic=!state.realistic;document.body.classList.toggle('realistic',state.realistic);$('style-toggle').setAttribute('aria-pressed',state.realistic);$('style-toggle').textContent='風格：'+(state.realistic?'寫實':'模擬');$('status').textContent=state.realistic?'寫實模式：鏡面顯示倒影，光束帶發光效果':'模擬模式';invalidate();};
$('top').onclick=()=>setView(true);$('free').onclick=()=>setView(false);
$('power').onclick=()=>{state.on=!state.on;$('power').setAttribute('aria-pressed',state.on);$('power-text').textContent='Ray box　'+(state.on?'開啟':'關閉');$('status').textContent=state.on?'Ray box 已開啟':'Ray box 已關閉';invalidate();};
$('direction').oninput=e=>{state.angle=+e.target.value;invalidate();};
const pointers=new Map();canvas.onpointerdown=e=>{pointers.set(e.pointerId,[e.clientX,e.clientY]);canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId),next=[e.clientX,e.clientY];if(pointers.size===2){const other=[...pointers.entries()].find(([id])=>id!==e.pointerId)[1],a=Math.hypot(prev[0]-other[0],prev[1]-other[1]),b=Math.hypot(next[0]-other[0],next[1]-other[1]);if(a>1)state.zoom=Math.max(.75,Math.min(1.4,state.zoom*b/a));}else if(!state.top){state.yaw-=(next[0]-prev[0])*.007;state.elevation=Math.max(.22,Math.min(1.5,state.elevation+(next[1]-prev[1])*.006));}pointers.set(e.pointerId,next);invalidate();};
canvas.onpointerup=canvas.onpointercancel=canvas.onlostpointercapture=e=>pointers.delete(e.pointerId);
canvas.addEventListener('wheel',e=>{e.preventDefault();state.zoom=Math.max(.75,Math.min(1.4,state.zoom*Math.exp(-e.deltaY*.001)));invalidate();},{passive:false});
function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);invalidate();}new ResizeObserver(resize).observe(canvas);
function animate(){if(dirty){draw();dirty=false;}requestAnimationFrame(animate);}resize();animate();
</script></body></html>
