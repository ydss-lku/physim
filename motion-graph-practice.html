function teachingTerms(value){
 return String(value)
  .replace(/嗰刻嘅相對參考點嘅/g,'嗰刻相對參考點嘅')
  .replace(/嘅位置保持靜止/g,'嘅地方保持靜止')

  .replace(/s 嘅改變\s*\u0394s(?: \(change in s\))?/g,'s 嘅改變（\u0394s）')
  .replace(/\bposition(s)?\b/gi,(word,plural)=>word[0]==='P'?'Displacement'+(plural?'s':''):'displacement'+(plural?'s':''))
  .replace(/初始位置|起始位置/g,'初始位移')

q(1,'s',[[0,-3],[4,-3]],'圖中嘅線在時間軸下方，代表甚麼？',['在原點負方向 3 m 處靜止','以 −3 m s⁻¹ 移動','正向減速','已走了 −3 m 距離'],'負的位置表示在原點的負方向一側；水平線的斜率為零，物體靜止。距離不會是負數。','位置的正負，與移動方向是兩回事。');
q(2,'v',[[0,-2],[4,-6]],'由 0 至 4 s，物體的速率如何改變？',['由 2 增至 6 m s⁻¹','由 −2 減至 −6 m s⁻¹，所以變慢','維持不變','先變慢後變快'],'速率是速度的量值 v 嘅大小。雖然 v 變得更負，但 v 嘅大小 由 2 增至 6，物體沿負方向加速。','看離 v = 0 有多遠。');
q(2,'v',[[0,-8],[4,-2]],'這段運動應如何描述？',['沿負方向移動，速率減小','沿正方向移動，速率增加','沿負方向移動，速率增加','在 t = 4 s 返回原點'],'v 始終小於零，所以沿負方向移動；v 嘅大小 由 8 減至 2，速率減小。','方向看 v 的符號；快慢看 v 嘅大小。');
q(3,'v',[[0,4],[2,0],[4,-4]],'t = 2 s 時 v 穿過零，哪項一定正確？',['瞬時靜止，並由正向轉為負向','返回原點','加速度是零','從此一直靜止'],'v 由正變負，所以在 t = 2 s 轉向。此刻 a = −2 m s⁻²；沒有初始位置資料，不能斷定在原點。','v = 0 只告訴你瞬時靜止；速度穿過零，而且正負號有改變才表示轉向。');
q(3,'v',[[0,3],[2,0],[4,3]],'v 在 t = 2 s 接觸零後回升。物體有沒有轉向？',['沒有；兩側的 v 都是正值','有；只要 v = 0 就轉向','有；圖中嘅線轉彎就是物體轉向','無法知道移動方向'],'物體瞬時靜止，但前後都沿正方向移動。v–t 圖的拐角不是空間中的轉彎；拐角處不要求判斷瞬時加速度。','檢查零點前後 v 嘅正負號有沒有改變。');
q(4,'v',[[0,4],[2,0],[4,-4]],'0 至 4 s 的位移及距離分別是多少？',['位移 0 m；距離 8 m','位移 8 m；距離 0 m','位移 0 m；距離 0 m','位移 −8 m；距離 8 m'],'上方面積 +½×2×4 = +4 m，下方面積 −4 m。位移 = +4 − 4 = 0；距離 = 4 + 4 = 8 m。','位移用有符號面積；距離把每塊面積取正再相加。');
q(4,'v',[[0,6],[2,0],[4,-6]],'0 至 4 s 的平均速度及平均速率是多少？',['0 m s⁻¹；3 m s⁻¹','3 m s⁻¹；0 m s⁻¹','0 m s⁻¹；0 m s⁻¹','6 m s⁻¹；6 m s⁻¹'],'總位移 = 6 − 6 = 0 m；總距離 = 12 m。分別除以 4 s，得到平均速度 0、平均速率 3 m s⁻¹。','平均速度用位移；平均速率用距離。');
q(5,'v',[[0,2],[3,2]],'已知 s₀ = +5 m。t = 3 s 時的位置是甚麼？',['+11 m','+6 m','+2 m','+5 m'],'面積給出位置的改變 Δs (change in s) = 2×3 = +6 m。最後位置 s = s₀ + Δs (change in s) = 5 + 6 = +11 m。','面積是改變量；最後值要加初始值。');
q(5,'v',[[0,-3],[2,-3]],'已知 s₀ = +10 m。t = 2 s 時的位置是甚麼？',['+4 m','−6 m','+16 m','−3 m'],'Δs (change in s) = (−3)×2 = −6 m，s = 10 − 6 = +4 m。速度為負不代表位置為負。','先算 Δs (change in s)，再加 s₀。');
q(6,'a',[[0,0],[4,0]],'已知初速度 u = +3 m s⁻¹。物體接着怎樣運動？',['以 +3 m s⁻¹ 勻速移動','立即靜止','速度每秒增加 3 m s⁻¹','一定在原點'],'a = 0 表示速度不變，不表示速度是零。初速度 +3 m s⁻¹ 會保持不變。','零加速度 ≠ 零速度。');
q(6,'v',[[0,-4],[5,-4]],'這條水平的 v–t 圖代表甚麼？',['a = 0，沿負方向勻速移動','v = 0，物體靜止','a = −4 m s⁻²','位置一直不變'],'速度固定在 −4 m s⁻¹，斜率為零，所以加速度為零。5 s 的位置改變是 −20 m。','先看縱軸是 s、v 還是 a，才解讀水平線。');
q(7,'a',[[0,-2],[2,-2]],'已知 u = −3 m s⁻¹。0 至 2 s 物體會變快還是變慢？',['變快：v 由 −3 變成 −7 m s⁻¹','變慢：負加速度必定是減速','速率不變','先正向再負向'],'v = u + at = −3 − 2×2 = −7 m s⁻¹。v 與 a 嘅正負號相同，速率增大。負加速度表示加速度朝負方向。','v、a 嘅正負號相同 → 變快；兩者嘅正負號相反 → 變慢（轉向前）。');
q(7,'a',[[0,2],[2,2]],'已知 u = −6 m s⁻¹。0 至 2 s 的速率如何改變？',['由 6 減至 2 m s⁻¹','由 6 增至 10 m s⁻¹','由 −6 增至 −2，所以變快','保持 6 m s⁻¹'],'v = −6 + 2×2 = −2 m s⁻¹，速率由 6 減至 2。正加速度也可以令物體減速。','不要單靠 a 的正負判斷快慢。');
q(8,'a',[[0,2],[3,2]],'a–t 圖在 0 至 3 s 的面積 +6 代表甚麼？',['速度改變 +6 m s⁻¹','最後速度必定 +6 m s⁻¹','位移 +6 m','距離 6 m'],'a–t 的面積是 Δv (change in v) = +6 m s⁻¹；只有初速度為零，最後速度才等於 +6 m s⁻¹。','(m s⁻²) × s = m s⁻¹，不是 m。');
q(8,'a',[[0,-2],[3,-2]],'已知 u = +8 m s⁻¹。t = 3 s 時速度是多少？',['+2 m s⁻¹','−6 m s⁻¹','+14 m s⁻¹','0 m s⁻¹'],'面積 Δv (change in v) = −2×3 = −6 m s⁻¹；v = u + Δv (change in v) = 8 − 6 = +2 m s⁻¹。','a–t 面積給 Δv (change in v)；不要漏加 u。');
q(9,'s',[[0,1],[4,9]],'哪組 v–t 與 a–t 描述符合這條 s–t 直線？',['v = +2 的水平線；a = 0','v 不斷上升；a 為正','v = +9 的水平線；a = +2','v = 0；a = 0'],'s–t 是固定斜率的斜直線，所以速度恆定 +2 m s⁻¹，加速度為零。位置增加不代表速度增加。','s–t 斜直線 → v–t 水平線 → a = 0。');
q(9,'v',[[0,0],[4,8]],'這段運動的 s–t 圖應有甚麼特徵？',['斜率由零開始，愈來愈大','斜率固定的斜直線','水平直線','斜率愈來愈負'],'速度由零均勻增加，所以 s–t 的切線斜率由零開始增加，圖中嘅線向上彎曲；初始位置只會上下平移整條圖。','v 是 s–t 的斜率，不是 s–t 的高度。');
q(10,'s',[[0,0],[1,1],[2,4],[3,9],[4,16]],'已知 s = t²。t = 2 s 的瞬時速度是多少？',['4 m s⁻¹','2 m s⁻¹','8 m s⁻¹','4 m s⁻²'],'t = 2 s 的切線可取 (1,0) 和 (3,8)，斜率 = (8 − 0) ÷ (3 − 1) = 4 m s⁻¹。s/t = 2 是由 0 至 2 s 的平均速度。','曲線的瞬時速度要用該點切線斜率。',{fn:t=>t*t,tangent:[[1,0],[3,8]]});
q(10,'s',[[0,0],[1,2],[2,8],[3,18],[4,32]],'已知 s = 2t²。t = 2 s 的瞬時速度是多少？',['8 m s⁻¹','4 m s⁻¹','16 m s⁻¹','8 m s⁻²'],'圖中的切線通過 (1,0) 和 (3,16)，斜率 = 16÷2 = 8 m s⁻¹。從原點到 (2,8) 的割線斜率 4 是平均速度。','切線斜率與連到原點的割線斜率不同。',{fn:t=>2*t*t,tangent:[[1,0],[3,16]]});
q(11,'v',[[0,2],[2,0],[4,-2]],'已知 s₀ = +5 m。t = 4 s 時，物體在哪裏？',['返回起點 s = +5 m，但不在原點','返回原點 s = 0','在 s = +9 m','在 s = −5 m'],'正負面積相消，Δs (change in s) = 0，所以返回起點。起點是 +5 m，而原點是 s = 0。','返回起點：Δs (change in s) = 0；到達原點：s = 0。');

function qualitativeGraph(type,pts,opt){
 const W=480,H=280,L=52,R=34,T=38,B=35,xmax=4;
 let lo=Math.min(0,...pts.map(p=>p[1])),hi=Math.max(0,...pts.map(p=>p[1]));if(lo===hi){lo=-1;hi=1}const pad=(hi-lo)*.22;lo-=pad;hi+=pad;
 const X=t=>L+t/xmax*(W-L-R-22),Y=y=>T+(hi-y)/(hi-lo)*(H-T-B);
 const path=pts.map(([t,y],i)=>(i?'L':'M')+X(t)+','+Y(y)).join(' ');
 return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="${escape(opt.description.join(' / '))}"><line class="axis" x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}"/><line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${H-B}"/><path d="M ${W-R-6},${Y(0)-4} L ${W-R},${Y(0)} L ${W-R-6},${Y(0)+4} M ${L-4},${T+6} L ${L},${T} L ${L+4},${T+6}" class="axis-arrow" fill="none"/><text x="${L-20}" y="${Y(0)+5}">0</text><text class="axis-label" x="${L-9}" y="28">${type}</text><text class="axis-label" x="${W-R+6}" y="${Y(0)+7}">t</text><path class="curve" d="${path}"/>${opt.qualPoint?`<circle class="dot" cx="${X(2)}" cy="${Y(0)}" r="6"/><text x="${X(2)+10}" y="${Y(0)-12}">P</text>`:''}</svg>`;
}

ion>`;

function validGuide(rec){
 if(rec.guide===undefined)return true;
 const g=rec.guide,plan=guidedPlan(Q[rec.id]);if(!plan||!g||g.version!==1||!['steps','retry','transfer','done'].includes(g.stage)||!Number.isInteger(g.index)||g.index<0||g.index>plan.steps.length||typeof g.complete!=='boolean'||!Array.isArray(g.steps)||g.steps.length>plan.steps.length||!Array.isArray(g.retry)||g.retry.length>200)return false;
 const check=(e,s)=>e&&e.id===s.id&&typeof e.hintUsed==='boolean'&&(e.definitionUsed===undefined||typeof e.definitionUsed==='boolean')&&Array.isArray(e.answers)&&e.answers.length<=200&&e.answers.every(a=>Number.isInteger(a)&&a>=0&&a<s.options.length)&&!!e.passed===(e.answers.at(-1)===0);

 st:gp('On s–t, each y-coordinate gives displacement s.<br>Velocity is change in s divided by change in time.<br>That ratio is the slope ⇒ read the slope to find v.','s–t 嘅每一點 y 坐標代表位移 s。<br>速度 = s 嘅改變 ÷ 時間嘅改變。<br>呢個比值就係斜率 ⇒ 要睇斜率先知 v。'),
 vt:gp('On v–t, each y-coordinate already gives velocity v.<br>The acceleration is change in v divided by change in time.<br>That ratio is the slope ⇒ read the slope to find a.','v–t 嘅每一點 y 坐標已經代表速度 v。<br>加速度 = v 嘅改變 ÷ 時間嘅改變。<br>呢個比值就係斜率 ⇒ 要睇斜率先知 a。'),
 speed:gp("On a v–t graph, each point’s y-coordinate is velocity v.<br>⇒ Its sign gives the direction of motion.<br>The magnitude of that y-coordinate is the magnitude of v, the speed.<br>⇒ Compare magnitude of v at different times to decide whether speed changes.","v–t 圖上每一點嘅 y 坐標就係速度 v。<br>⇒ 呢個數值嘅正負，話畀你知向邊行。<br>呢個 y 坐標嘅大小係 v 嘅大小，即係速率。<br>⇒ 比較唔同時間嘅 v 嘅大小，先知道速率有冇變。"),
 accel:gp("On an a–t graph, each point’s y-coordinate gives acceleration a at that time.<br>Equal y-coordinates ⇒ a is constant.<br>Acceleration is the rate of change of velocity.<br>⇒ a = 0 means v does not change; constant non-zero a means v changes by equal amounts in equal time intervals.<br>For constant a, Δv (change in v) = a × time interval. The initial velocity is needed to find v.","a–t 圖上每一點嘅 y 坐標，代表嗰刻嘅加速度 a。<br>y 坐標一樣 ⇒ a 不變。<br>加速度係速度隨時間嘅變化率。<br>⇒ a = 0 代表 v 冇改變；a 固定而且唔係零，就代表每段相同時間，v 都改變相同嘅量。<br>a 固定時，Δv (change in v) = a × 時間間隔。要搵 v，仲要知道初速度。"),
 va:gp('Signed v–t area gives Δs (change in s). Final position s = s₀ + Δs (change in s). Distance uses area magnitudes.','v–t 按縱軸讀數嘅正負計算嘅面積代表 Δs (change in s)。最後位置 s = s₀ + Δs (change in s)。距離用面積嘅大小。'),
 aa:gp('Signed a–t area gives Δv (change in v). Final velocity v = u + Δv (change in v).','a–t 按縱軸讀數嘅正負計算嘅面積代表 Δv (change in v)。最後速度 v = u + Δv (change in v)。'),
 tangent:gp('Instantaneous velocity is the tangent slope at the chosen time on s–t. Slope = vertical change / time change.','s–t 喺指定時刻嘅切線 slope 代表瞬時速度。Slope = 縱向改變 ÷ 時間改變。'),
 average:gp('Average velocity = total displacement / total time. Average speed = total distance / total time.','平均速度 = 總位移 ÷ 總時間。平均速率 = 總距離 ÷ 總時間。'),
 turn:gp('The sign of v gives direction. A turn requires different signs of v before and after the instant.','v 嘅正負代表方向。轉向要嗰刻前後嘅 v 嘅正負號有改變。')
};
function ask(id,en,zh,choices,hint,definition,extra={}){return guideStep(id,gp(en,zh),choices,hint,{definition,...extra});}
const opt=(en,zh)=>gp(en,zh);
const simpleGraph=(type,pts,description)=>({type,pts,qualitative:true,description});
const featureStep=type=>ask('feature','Which graph feature gives '+(type==='s'?'velocity':'acceleration')+'?',`喺呢幅圖，睇乜先知${type==='s'?'速度':'加速度'}？`,[opt('The slope','斜率'),opt('The vertical reading','縱軸（y axis）讀數'),opt('The area between the graph and the t-axis','圖像同 t 軸之間嘅面積')],gp('First name the vertical quantity. Which change with time are we looking for?','先講出縱軸個量，再諗我哋要搵佢隨時間嘅乜嘢改變。'),defs[type==='s'?'st':'vt']);
const speedDefinition=()=>ask('speed-definition','Which tells us how fast the object moves?','邊樣話到你知物體行得幾快？',[opt('The magnitude of v','v 嘅大小'),opt('Only whether v is positive or negative','只睇 v 係正定負')],gp('Separate “which direction?” from “how fast?”.','「向邊行」同「行幾快」要分開。'),defs.speed);
const accelerationMeaning=()=>ask('acceleration-meaning','What does acceleration describe?','加速度描述緊乜？',[opt('How velocity changes with time','速度隨時間點變'),opt('The position of the object','物體嘅位置'),opt('The velocity itself','速度本身')],gp('Think about the meaning of the word “change”.','諗返定義入面，究竟係邊個量改變。'),defs.accel);
const constantSlope=(type='s')=>ask('constant-slope','Look at the slope of this line. Which statement is correct?','留意呢條線嘅斜率。以下邊項正確？',[opt('The slope stays constant','Slope 不變'),opt('The line becomes steeper','條線愈嚟愈斜')],gp('Compare the tilt, not the height.','比較傾斜程度，唔係高度。'),defs[type==='s'?'st':'vt']);
function signStep(id,en,zh,positive){return ask(id,en,zh,[opt(positive?'Positive':'Negative',positive?'正':'負'),opt(positive?'Negative':'Positive',positive?'負':'正')],gp('Find the time axis (v = 0). Read the vertical value, not the slope.','先搵時間軸（v = 0），讀縱軸（y 軸）數值，唔係讀 slope。'),defs.speed);}
function expandedGuidePlan(q){
 const id=q.id;
 if([0,1].includes(id))return {kind:'slope',steps:[axisStep(q.type),featureStep(q.type),constantSlope(q.type),
  ask('slope-ratio','How should we calculate the slope between the two endpoints?','用兩個端點計 slope，應該點計？',[opt('(10 − 2) / (4 − 0)','(10 − 2) ÷ (4 − 0)'),opt('10 / 4','10 ÷ 4'),opt('10 − 2','10 − 2')],gp('Both axes need a change: final reading minus initial reading.','兩條軸都要計改變：最後讀數減初始讀數。'),defs[q.type==='s'?'st':'vt'])],
  transfer:ask('shifted-line',`The new ${q.type}–t line is parallel to the original. Is its ${q.type==='s'?'velocity':'acceleration'} the same?`,`新嘅 ${q.type}–t 圖中嘅線同原本平行。${q.type==='s'?'速度':'加速度'}係咪一樣？`,[opt('Yes: the slope is unchanged','係：slope 冇變'),opt('No: the vertical readings are larger','唔係：縱軸讀數大咗')],gp('Use the feature you just identified.','用返頭先確認咗嗰個圖像特徵。'),defs[q.type==='s'?'st':'vt'],{given:gp('Earlier graph: at t = 0 s, '+q.type+' = 2 '+(q.type==='s'?'m':'m s⁻¹')+'; at t = 4 s, '+q.type+' = 10 '+(q.type==='s'?'m':'m s⁻¹')+'.','頭先幅圖：t = 0 s 時，'+q.type+' = 2 '+(q.type==='s'?'m':'m s⁻¹')+'；t = 4 s 時，'+q.type+' = 10 '+(q.type==='s'?'m':'m s⁻¹')+'。'),graph:{type:q.type,pts:[[0,5],[4,13]]}})};
 if([2,3,24,25].includes(id))return {kind:'rest',steps:[axisStep('s'),featureStep('s'),
  ask('horizontal-slope','What is the slope of this horizontal line?','呢條水平線嘅 slope 係幾多？',[opt('Zero','零'),opt('Positive','正'),opt('Negative','負')],gp('Compare the left and right sides of the line. Is it lower on the left and higher on the right, higher on the left and lower on the right, or the same height on both sides?','比較條線左右兩邊：係左低右高、左高右低，定左右一樣高？'),defs.slopeSign),
  ask('zero-slope-quantity','The s–t slope is zero. Which quantity must therefore be zero?','s–t 嘅 slope 係零，所以邊個量係零？',[opt('Velocity v','速度 v'),opt('Position s','位置 s')],gp('Use slope = the quantity you named in the previous question.','用返頭先嘅關係：slope 代表邊個量？'),defs.st)],
  transfer:ask('horizontal-v','This is a new v–t graph. Does the object remain at rest?','呢幅新圖係 v–t 圖。物體係咪保持靜止？',[opt('No: it has a constant non-zero velocity','唔係：速度不變，但唔係零'),opt('Yes: the line is horizontal','係：條線水平')],gp('This is a v–t graph. What does the y-coordinate of each point represent?<br><br>Compare the y-coordinates at two different times. Are they equal? Are they zero?','呢幅係 v–t 圖。條線上面每一點嘅 y 坐標代表乜？<br><br>揀兩個唔同時間，睇吓兩點嘅 y 坐標：係咪一樣？係咪零？'),gp('This is a v–t graph.<br>⇒ The y-coordinate of each point represents velocity v.<br><br>The line is horizontal.<br>⇒ Every point has the same y-coordinate.<br>⇒ v is constant.<br><br>The line is higher than the time axis (v = 0).<br>⇒ v > 0, so this constant velocity is non-zero.<br><br>Remaining at rest requires v = 0 throughout. Use this to check your answer again.','睇清楚，呢幅係 v–t 圖。<br>⇒ 每一點嘅 y 坐標已經代表速度 v。<br><br>呢條係水平線。<br>⇒ 條線上面每一點嘅 y 坐標都一樣。<br>⇒ 即係 v 不變。<br><br>條線高過時間軸（v = 0）。<br>⇒ v 大過零，所以呢個不變嘅速度唔係零。<br><br>要保持靜止，v 就要全程都係零。用返呢個定義，再睇吓你揀嘅答案。'),{graph:simpleGraph('v',[[0,2],[4,2]],gp('A horizontal v–t line higher than the time axis (v = 0).','v–t 水平線高過時間軸（v = 0）。'))})};
 if(id===5){

  const transferSign=negative?1:-1;
  return {kind:'speed',steps:[axisStep('v'),
   ask('direction-reading','To find direction of motion, which sign do we use?','判斷向邊行，要用邊個正負號？',[opt('The sign of v','v 嘅正負'),opt('The sign of the slope of the v–t graph','v–t 圖嘅斜率正負')],gp('The slope describes a different quantity. Read v itself.','Slope 描述另一個量。要直接讀 v。'),defs.speed),
   speedDefinition(),
   ask('zero-distance','As time passes, does the line move closer to zero or farther from zero?','時間過緊，條線係近零咗，定遠離零？',[opt(faster?'Farther from zero':'Closer to zero',faster?'遠離零':'接近零'),opt(faster?'Closer to zero':'Farther from zero',faster?'接近零':'遠離零')],gp('Compare the vertical distance from v = 0 at the start and at the end.','比較開頭同結尾離 v = 0 嘅垂直距離。'),defs.speed)],
   transfer:ask('opposite-sign-speed','Read the NEW graph. Describe direction AND speed change.','睇呢幅新圖。向邊行？快慢又點變？',[opt(`${transferSign>0?'Positive':'Negative'} direction; ${faster?'speeding up':'slowing down'}`,`${transferSign>0?'向正':'向負'}方向；${faster?'加速':'減速'}`),opt(`${transferSign>0?'Positive':'Negative'} direction; ${faster?'slowing down':'speeding up'}`,`${transferSign>0?'向正':'向負'}方向；${faster?'減速':'加速'}`),opt(`${transferSign>0?'Negative':'Positive'} direction; ${faster?'speeding up':'slowing down'}`,`${transferSign>0?'向負':'向正'}方向；${faster?'加速':'減速'}`)],gp('Direction uses the sign of v; speed uses its distance from zero.','方向睇 v 正負；快慢睇離零有幾遠。'),defs.speed,{graph:simpleGraph('v',[[0,transferSign*(faster?1:3)],[4,transferSign*(faster?3:1)]],gp('A straight v–t line entirely on the opposite side of zero.','v–t 斜直線全段喺零嘅另一邊。'))})};
 }
 if([4,28,29,30,31].includes(id)){
  const negative=q.pts[0][1]<0,faster=Math.abs(q.pts.at(-1)[1])>Math.abs(q.pts[0][1]);
  const increasing=q.pts.at(-1)[1]>q.pts[0][1],transferSign=negative?1:-1;
  const reading=gp(
   'Each y-coordinate on this v–t graph represents velocity v.<br>From left to right, the y-coordinates '+(increasing?'increase':'decrease')+'.<br>⇒ v '+(increasing?'increases':'decreases')+'; it does not stay constant.',
   '呢幅 v–t 圖每一點嘅 y 坐標代表速度 v。<br>由左向右睇，y 坐標'+(increasing?'增加':'減少')+'。<br>⇒ v '+(increasing?'增加':'減少')+'，唔係不變。');
  const magnitude=gp(
   'Speed is the magnitude of velocity v.<br>Here v stays '+(negative?'negative':'positive')+'. The graph gets '+(faster?'farther from':'closer to')+' the time axis (v = 0).<br>⇒ The magnitude of v '+(faster?'increases':'decreases')+'.<br>⇒ Speed '+(faster?'increases':'decreases')+'.',
   '速率係速度 v 嘅大小。<br>呢度 v 一直係'+(negative?'負':'正')+'，圖中嘅線愈嚟愈'+(faster?'遠離':'接近')+'時間軸（v = 0）。<br>⇒ v 嘅大小'+(faster?'增加':'減少')+'。<br>⇒ 速率'+(faster?'增加':'減少')+'。');
  return {kind:'speed',steps:[axisStep('v'),
   ask('speed-y-reading','From left to right, do the y-coordinates stay constant, increase or decrease?','由左向右睇，圖中嘅線上各點嘅 y 坐標係不變、增加，定減少？',[opt(increasing?'Increase':'Decrease',increasing?'增加':'減少'),opt('Stay constant','不變'),opt(increasing?'Decrease':'Increase',increasing?'減少':'增加')],gp('Compare the heights of the points near the start and near the end. Each height gives v, not the slope.','比較開頭同結尾啲點嘅高度。每一點嘅高度代表 v，唔係斜率。'),reading),
   speedDefinition(),
   ask('speed-magnitude','How does the magnitude of velocity v change?','速度 v 嘅大小點樣變？',[opt(faster?'It increases':'It decreases',faster?'增加':'減少'),opt(faster?'It decreases':'It increases',faster?'減少':'增加'),opt('It stays constant','不變')],gp('Locate the time axis (v = 0). Compare each point’s vertical distance from it near the start and near the end. This distance represents the magnitude of v.','先搵時間軸（v = 0）。比較開頭同結尾啲點離時間軸嘅垂直距離；呢個距離代表 v 嘅大小。'),magnitude)],
   transfer:ask('opposite-sign-speed','Read the NEW v–t graph. How does the speed change?','睇呢幅新 v–t 圖。速率點樣變？',[opt(faster?'Speeds up uniformly':'Slows down uniformly',faster?'均勻加速':'均勻減速'),opt(faster?'Slows down uniformly':'Speeds up uniformly',faster?'均勻減速':'均勻加速'),opt('Moves with constant speed','以不變速率移動')],gp('Each y-coordinate gives v. Compare the magnitude of v at the start and at the end.','每一點嘅 y 坐標代表 v。比較開頭同結尾嘅 v 大小。'),gp('The new graph gets '+(faster?'farther from':'closer to')+' the time axis (v = 0).<br>⇒ The magnitude of v '+(faster?'increases':'decreases')+' ⇒ speed '+(faster?'increases':'decreases')+'.<br>The line is straight ⇒ equal changes in v in equal times ⇒ the speed changes uniformly.','新圖嘅圖中嘅線愈嚟愈'+(faster?'遠離':'接近')+'時間軸（v = 0）。<br>⇒ v 嘅大小'+(faster?'增加':'減少')+' ⇒ 速率'+(faster?'增加':'減少')+'。<br>圖中嘅線係直線 ⇒ 相同時間內 v 改變相同嘅量 ⇒ 速率均勻改變。'),{graph:simpleGraph('v',[[0,transferSign*(faster?1:3)],[4,transferSign*(faster?3:1)]],gp('A straight v–t graph.','一幅 v–t 直線圖。'))})};
 }
 if([6,7,34,35].includes(id)){
  const point=id>=34?'P':'t = 2 s',before=q.pts[0][1]>0,after=q.pts.at(-1)[1]>0,cross=before!==after;
  return {kind:'zero-velocity',steps:[axisStep('v'),
   ask('zero-reading',`At ${point}, is velocity v positive, negative or zero?`,`${point} 嗰點，速度 v 係正、負，定零？`,[opt('Zero','零'),opt('Positive','正'),opt('Negative','負')],gp('Compare the marked point with the time axis, where v = 0. Is the point higher than, lower than, or exactly on this axis?','比較標示嗰點同時間軸（v = 0）：嗰點係高過、低過，定正正喺時間軸？'),gp('The marked point lies exactly on the time axis. Its y-coordinate is zero, so v = 0.','標示嗰點正正喺時間軸，y 坐標係零，所以 v = 0。')),
   ask('rest-definition','What does zero velocity at an instant tell us?','某一刻速度零，話到我哋知乜？',[opt('The object is momentarily at rest','物體嗰刻瞬時靜止'),opt('The object is at the origin','物體喺原點'),opt('The object remains at rest afterwards','物體之後一直靜止')],gp('Position, motion at one instant and motion afterwards are different statements.','位置、嗰刻點郁、之後點郁，係三件唔同嘅事。'),gp('v = 0 means zero velocity at that instant. At the origin requires s = 0.','v = 0 係嗰刻速度零。喺原點要 s = 0。')),

   transfer:ask('zero-transfer','In this NEW v–t graph, does the object change direction at P?','呢幅新 v–t 圖，物體喺 P 點有冇轉向？',[opt(cross?'No: v has the same sign before and after P':'Yes: v changes sign across P',cross?'冇：P 前後速度 v 嘅正負號不變':'有：P 前後 v 嘅正負號有改變'),opt(cross?'Yes: v reaches zero':'No: v is zero at P',cross?'有：v 到咗零':'冇：P 點 v 係零')],gp('Read the sign of v on BOTH sides of P.','P 前同 P 後，兩邊嘅 v 都要睇。'),defs.turn,{graph:{...simpleGraph('v',cross?[[0,2],[2,0],[4,2]]:[[0,2],[2,0],[4,-2]],gp(cross?'v touches zero at P and stays positive on both sides.':'v changes from positive to negative across P.',cross?'v 喺 P 掂零，前後都係正。':'v 喺 P 前係正，之後係負。')),qualPoint:[2,0]}})};
 }
 if([12,32,33].includes(id))return {kind:'zero-acceleration',steps:[axisStep('a'),accelerationMeaning(),

  ask('initial-motion','The question says the object is already moving. Is its initial velocity zero?','題目話物體本身行緊。初速度係咪零？',[opt('No: it is non-zero','唔係：初速度唔係零'),opt('Yes: it is zero','係：初速度係零')],gp('Read the initial condition shown under “Given”.','睇下面「已知資料」嘅初始條件。'),gp('Moving means having non-zero velocity. Remaining at rest means velocity stays zero.','行緊即係速度唔係零。保持靜止先係速度一直零。'))],
  transfer:ask('rest-zero-a','Suppose another object is at rest at t = 0 and has a = 0 throughout. What happens?','如果依家有另一個物件，喺 t = 0 嘅時候靜止，之後 a 全程係零，佢會點？',[opt('It remains at rest','保持靜止'),opt('It starts moving with non-zero speed','開始以非零速率移動')],gp('Apply “velocity does not change” to this NEW initial velocity.','用「速度冇改變」，配合今次新嘅初速度。'),defs.accel,{graph:simpleGraph('a',[[0,0],[4,0]],gp('Acceleration stays zero.','加速度一直係零。'))})};
 if(id===13)return {kind:'constant-v',steps:[axisStep('v'),featureStep('v'),

function graph(type,pts,opt={}){
 if(opt.pilotTrapezium)return pilotGraph(opt);
 if(opt.qualitative)return qualitativeGraph(type,pts,opt);
 const W=opt.compact?300:480,H=opt.compact?250:330,L=opt.compact?43:55,R=30,T=56,B=80;
 const xmax=Math.max(...pts.map(p=>p[0]),1);let lo=opt.range?.[0]??Math.min(0,...pts.map(p=>p[1])),hi=opt.range?.[1]??Math.max(0,...pts.map(p=>p[1]));if(hi===lo){hi=2;lo=-2}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
 const X=t=>L+t/xmax*(W-L-R-22),Y=y=>T+(hi-y)/(hi-lo)*(H-T-B);
 let lines='';for(let i=0;i<=4;i++){const t=xmax*i/4;lines+=`<line class="grid" x1="${X(t)}" y1="${T}" x2="${X(t)}" y2="${H-B}"/><text x="${X(t)}" y="${H-52}" text-anchor="middle">${fmt(t)}</text>`}
 const vals=[...new Set([0,...pts.map(p=>p[1])])].sort((a,b)=>a-b),labels=opt.yticks||(vals.length>7?[lo+pad,(lo+hi)/2,hi-pad]:vals);
 for(const y of labels)lines+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(y)}" y2="${Y(y)}"/><text x="${L-7}" y="${Y(y)+4}" text-anchor="end">${fmt(y)}</text>`;
 const sampled=opt.fn?Array.from({length:101},(_,i)=>[xmax*i/100,opt.fn(xmax*i/100)]):pts;
 const d=sampled.map(([t,y],i)=>`${i?'L':'M'}${X(t)},${Y(y)}`).join(' ');
 const area=opt.area?`<path d="M ${X(pts[0][0])},${Y(0)} ${sampled.map(([t,y])=>`L ${X(t)},${Y(y)}`).join(' ')} L ${X(pts.at(-1)[0])},${Y(0)} Z" fill="#bdd58d" opacity=".35"/>`:'';
 const tangent=opt.tangent?`<path d="M${X(opt.tangent[0][0])},${Y(opt.tangent[0][1])} L${X(opt.tangent[1][0])},${Y(opt.tangent[1][1])}" stroke="#b35229" stroke-width="2" stroke-dasharray="6 4"/>`:'';
 const marker=opt.marker?`<line x1="${X(opt.marker[0])}" x2="${X(opt.marker[0])}" y1="${T}" y2="${H-B}" stroke="#b35229" stroke-dasharray="4 4"/><circle class="dot" cx="${X(opt.marker[0])}" cy="${Y(opt.marker[1])}" r="5"/>`:'';
 return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="${type}–t graph / ${type}–t 圖; points / 座標: ${pts.map(p=>p.join(', ')).join('; ')}">${lines}<line class="axis" x1="${L}" x2="${W-R+8}" y1="${Y(0)}" y2="${Y(0)}"/><line class="axis" x1="${L}" x2="${L}" y1="${T-8}" y2="${H-B}"/><path d="M ${W-R+2},${Y(0)-4} L ${W-R+8},${Y(0)} L ${W-R+2},${Y(0)+4} M ${L-4},${T-2} L ${L},${T-8} L ${L+4},${T-2}" class="axis-arrow" fill="none"/>${area}<path class="curve" d="${d}"/>${tangent}${marker}<text class="axis-label" x="10" y="34">${type} / ${type==='s'?'m':type==='v'?'m s⁻¹':'m s⁻²'}</text><text class="axis-label" text-anchor="end" x="${W-8}" y="${H-16}">t / s</text></svg>`;
}

function guide(){return '<div class="guide">'+[
 ['s–t: displacement–time','s–t：位移—時間關係線圖',[

function updateLab(){const {s0,u,a,t}=labState,S=x=>s0+u*x+.5*a*x*x,V=x=>u+a*x,s=S(t),v=V(t);['s0','u','a'].forEach(id=>document.querySelector('#'+id+'value').textContent=fmt(labState[id]));document.querySelector('#timevalue').textContent=fmt(t);document.querySelector('#time').value=t;const ts=[0,6];if(a!==0&&-u/a>0&&-u/a<6)ts.push(-u/a);const extrema=ts.map(S),low=Math.min(-2,0,...extrema),high=Math.max(2,0,...extrema),pos=x=>25+50*(x-low)/(high-low);document.querySelector('#track').innerHTML=`<div class="track"><div class="rail"></div><span class="origin" style="left:${pos(0)}%"></span><span class="car" style="left:${pos(s)}%">${motionCart(v)}</span><span class="tracklabel" style="left:${pos(0)}%">0</span><span class="tracklabel" style="left:25%">${fmt(low)} m</span><span class="tracklabel" style="left:75%">${fmt(high)} m</span></div>`;document.querySelector('#values').innerHTML=`<span class="tag">s = ${fmt(s)} m</span><span class="tag">v = ${fmt(v)} m s⁻¹</span><span class="tag">a = ${fmt(a)} m s⁻²</span>`;const message=Math.abs(v)<.005?(a===0?['v = 0 and a = 0: the object remains at rest.','v = 0 且 a = 0：物體保持靜止。']:[`Momentarily at rest at s = ${fmt(s)} m. ${Math.abs(s)<.005?'It happens to be at the origin too.':'It is not at the origin!'} With this acceleration it changes direction across this instant.`,`此刻在 s = ${fmt(s)} m 瞬時靜止。${Math.abs(s)<.005?'這次剛巧也在原點。':'這並不在原點！'}在這個加速度下，物體會在此刻前後改變運動方向。`]):a===0?['Acceleration describes velocity change. a = 0 ⇒ velocity does not change. Here v is non-zero ⇒ the object keeps moving at constant velocity.','加速度講緊速度點變。a = 0 ⇒ 速度冇改變。呢度 v 唔係零 ⇒ 所以物體繼續以不變速度移動。']:v*a>0?['v and a have the same sign: speed is increasing.','v 與 a 嘅正負號相同：速率正在增加。']:['v and a have opposite signs: speed is decreasing.','v 與 a 嘅正負號相反：速率正在減小。'];document.querySelector('#labnote').innerHTML=b(...message);const pts=Array.from({length:13},(_,i)=>[i/2,S(i/2)]);document.querySelector('#labplots').innerHTML=[['s',pts,{fn:S,marker:[t,s]}],['v',[[0,u],[6,V(6)]],{ma }

function quantityRanges(text){
 const ranges=[];
 for(const match of text.matchAll(/[A-Za-z]+[₀₁₂₃₄₅₆₇₈₉²³]*/g)){
  const token=match[0],i=match.index,before=text.slice(0,i),after=text.slice(i+token.length);
  if(/[A-Za-z][’']$/.test(before))continue;
  if(!/^(?:s[₀₁₂₃₄₅₆₇₈₉]?|v[²³]?|a|t[²³]?|u|ut|at²)$/.test(token))continue;
  // 's' as seconds stays roman, including m s⁻¹, t = 2 s and / s.
  if(token==='s'&&(/⁻/.test(after[0]||'')||/(?:\d|m|\/|seconds)\s*$/.test(before)))continue;
  // The English article 'a' is not the acceleration symbol.
  if(token==='a'&&/^\s+(?:question|graph|line|slope|value|change|turn|new|different|positive|negative|constant|horizontal|straight|zero|non|particular|reading|tangent|time|single|location|state|vertical|rate|few|quantity|point|sign|velocity|speed|number|curve|hint|definition|report|concept|relationship|minus|word|local|total|direction|smaller|larger|maximum|minimum|fixed|zero)\b/i.test(after))continue;
  if(token==='a'&&!(/^\s*(?:[=<>≠×÷+−–²³/]|and\s+v\b|(?:is|remains)\s+(?:zero|positive|negative|constant)\b|describes\b|gives\b)/.test(after)||/(?:\bof|\bsign of|\band|\bconstant|\bnegative|\bpositive|\bzero|\bsame|\bnon-zero)\s*$/.test(before)||/(?:加速度|Acceleration)\s*$/.test(before)||text.trim()==='a'||/\ba–t\b/.test(text.slice(i))))continue;
  ranges.push([i,token.length]);
 }
 return ranges;
}
function formatQuantitySymbols(root){
