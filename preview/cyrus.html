<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyrus</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #090c12;
    }
    main {
      width: min(100%, 1024px);
      padding-block: 12px;
      gap: 8px;
      display: grid;
      place-items: center;
      background: #151b25;
    }
    .controls {width:90%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 20px;color:#e8eef7;font:14px system-ui}
    .controls label {display:grid}
    input {width:100%;margin:0;accent-color:#6aaaff}
    #angle {grid-column:1/-1;text-align:center}
    #lamp {cursor:grab;touch-action:none}
    .frame { touch-action:none;
      display: block;
      background: #05070b;
      color: #e8eef7;
      font: 15px system-ui, sans-serif;
      box-sizing: border-box;
      width: 90%;
      aspect-ratio: 16 / 9;
      border: 2px solid #438dff;
    }
    .stage{position:relative;width:90%}.stage .frame{width:100%}
    .palette{position:absolute;right:6px;bottom:6px;color:white;font:13px system-ui}.palette summary{cursor:pointer;background:#132232;border:1px solid #8aa5be;border-radius:4px;padding:6px;list-style:none}
    .picker{position:absolute;right:0;bottom:100%;width:178px;background:#15202b;padding:9px;border-radius:6px}
    .wheel{display:block;width:64px;height:64px;margin:auto;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);border:2px solid white;touch-action:none;cursor:crosshair}
    main {box-sizing:border-box;aspect-ratio:627/322;grid-template-columns:minmax(0,378fr) minmax(0,174fr);grid-template-rows:minmax(0,1fr);gap:3%;padding:4.3% 4% 5% 5%;align-items:stretch}
    body {container-type:inline-size}
    main {padding:min(4.3vw,44px) min(4vw,41px) min(5vw,51px) min(5vw,51px)}
    .stage,.controls {width:100%;min-width:0;min-height:0}
    .stage .frame {height:100%;aspect-ratio:auto}
    .controls {box-sizing:border-box;border:1px solid #65798e;padding:8px;grid-template-columns:minmax(0,1fr);align-content:start;overflow:auto}
    #fullscreen {position:absolute;right:6px;top:6px;background:#132232;color:white;border:1px solid #8aa5be;border-radius:4px;padding:6px;cursor:pointer}
    main:fullscreen,main.expanded {width:100%;height:100dvh;max-width:none;aspect-ratio:auto}
    main.expanded {position:fixed;inset:0;z-index:10}
    @media(max-width:600px) and (orientation:portrait) {
      main {aspect-ratio:auto;padding:8px;grid-template-columns:100%;grid-template-rows:auto auto;gap:8px}
      .stage {aspect-ratio:378/263}
      main:fullscreen,main.expanded {align-content:start;overflow:auto}
    }
    main:is(:fullscreen,.expanded) {display:block;padding:0;overflow:hidden;background:#05070b}
    main:is(:fullscreen,.expanded) .stage {width:100%;height:100%;aspect-ratio:auto}
    main:is(:fullscreen,.expanded) .controls {display:none}
    main:is(:fullscreen,.expanded) .frame {border:0}
    #fullscreen svg,.bookIcon{width:24px;height:24px;vertical-align:middle}
    .rainbowIcon{display:block;width:22px;height:22px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);mask:radial-gradient(circle,transparent 25%,black 29%);animation:rainbowTurn 5s linear infinite}
    @keyframes rainbowTurn{to{transform:rotate(360deg)}}
    #tutorial{max-width:min(340px,82vw);background:#172534;color:white;border:1px solid #82aeda;border-radius:8px;font:16px system-ui}
    #tutorial::backdrop{background:#000a}
    #tutorial svg{display:block;width:100%;background:#07111a}
    #tutorial footer{display:flex;justify-content:space-between}
    .demoMove{animation:demoMove 3s ease-in-out infinite alternate}
    @keyframes demoMove{to{transform:translate(45px,-15px)}}
    @media(prefers-reduced-motion:reduce){.rainbowIcon,.demoMove{animation:none}}
    .sourceSlide{animation:sourceSlide 3s ease-in-out infinite alternate}@keyframes sourceSlide{to{transform:translateX(45px)}}
    .demoMirror{animation:mirrorSlide 2s ease-in-out infinite alternate}
    .demoRotate{transform-origin:110px 43px;animation:dialTurn 2s ease-in-out infinite alternate}
    .demoCamera{transform-origin:center;animation:cameraMove 3s ease-in-out infinite alternate}
    .demoColour{animation:colourChange 3s linear infinite alternate}
    @keyframes mirrorSlide{to{transform:translateY(32px)}}
    @keyframes dialTurn{from{transform:rotate(-40deg)}to{transform:rotate(45deg)}}
    @keyframes cameraMove{to{transform:translate(12px,5px) rotate(10deg) scale(1.25)}}
    @keyframes colourChange{0%{color:#ff5555}50%{color:#60ddff}100%{color:#86ee84}}
    @media(prefers-reduced-motion:reduce){#demoPicture *{animation:none}}
    .dimensions{position:absolute;top:6px;left:6px;display:flex;gap:4px}.dimensions button{width:36px;height:36px;color:white;background:#132232;border:1px solid #8aa5be;border-radius:4px}.dimensions [aria-pressed="true"]{background:#254f75;border-color:#92cbff}.controls [hidden]{display:none}
    </style>
</head>
<body>
  <main aria-label="Simulation area">
    <div class="stage"><svg class="frame" viewBox="0 -43 640 446" aria-label="Reflection at a plane mirror">
      <defs>
        <filter id="rayGlow" filterUnits="userSpaceOnUse" x="0" y="0" width="640" height="360">
          <feGaussianBlur stdDeviation="5"/>
        </filter>
      </defs>
      <g id="world"><g fill="currentColor" text-anchor="middle">
        <rect x="36" y="36" width="568" height="288" fill="none" stroke="#bac7d5" opacity=".32" stroke-dasharray="2 5"/>
        <path id="floorTrace" fill="none" stroke="#91a7b7" stroke-width="1" stroke-dasharray="4 5" pointer-events="none"/><path id="heightEdges" fill="none" stroke="#91a7b7" stroke-width="1" stroke-dasharray="2 4" pointer-events="none"/><path id="mirrorFace" fill="#487184" fill-opacity=".75" stroke="#b4dce7" pointer-events="none"/><path id="mirror" d="M166 180 H474" stroke="#9bd8f0" stroke-width="5"/>
        <path id="mirrorTouch" fill="none" stroke="transparent" stroke-width="24" pointer-events="stroke" style="touch-action:none;cursor:ns-resize"/><path id="topGrip" fill="none" stroke="#bfedf3" stroke-width="5" style="cursor:ns-resize;touch-action:none"><title>Drag to change mirror height</title></path><g id="opticalPlane"><g id="guide">
        <g id="meter" fill="#a2b2c4" font-size="10" aria-label="Protractor, zero at the normal"></g>
        <path d="M320 56 V220" stroke="#abbaca" stroke-dasharray="7 5"/>
        <text x="320" y="234">Normal</text>
        </g>
        <g fill="none" stroke="#ff334b" stroke-width="14" filter="url(#rayGlow)" id="halo">
          <use href="#incident"/><use href="#reflected"/>
        </g>
        <g fill="none" stroke="#ff858a" stroke-width="2">
          <path id="incident"/><path id="reflected"/>
        </g>
        <path id="filament" display="none" fill="none" stroke-width="1.2" stroke-linejoin="round"/>
        <g id="arrows" fill="#ffc2bf"></g>
        <g id="lamp"><circle r="22" fill="transparent"/><g id="sourceDepth" pointer-events="none" style="filter:brightness(.53)"></g><g id="standardSource"><rect x="-10" y="-3" width="20" height="27" rx="4" fill="#b8c6d6"/><path d="M-9 -3 H9" stroke="#fff0b8" stroke-width="4"/></g><g id="gauntlet" display="none" stroke="#41242a" stroke-width="1.1" stroke-linejoin="round"><g fill="#b73839"><path d="M-10 -4 L-15 -14 Q-16 -18 -13 -18 L-6 -9 L-9 -22 Q-9 -25 -6 -24 L-2 -11 L-3 -25 Q-2 -28 1 -25 L3 -11 L4 -23 Q6 -26 8 -22 L7 -7 L11 -13 Q15 -15 14 -10 L10 2 L8 9 L6 21 L-6 21 L-8 9 Z"/></g><path fill="#d6a657" d="M-9 -4 L-3 -8 L6 -6 L9 0 L5 8 L-5 9 L-9 3 Z M-6 12 L6 11 L5 18 L-5 19 Z"/><path fill="none" d="M-12 -13 l3 -2 M-8 -17 l4 -1 M-3 -19 h4 M4 -17 h4 M-6 14 l11 -1"/><circle r="4.8" fill="#272932"/><circle id="core" r="3.4" stroke="none"/></g></g>
        <text pointer-events="none" id="incomingLabel">Incident ray</text>
        <text pointer-events="none" id="outgoingLabel">Reflected ray</text></g>
      </g>
      <g id="dial" display="none" style="touch-action:none" fill="none"><circle r="39" stroke="#8ed275" stroke-width="2"/><g id="arm"><path d="M0 0 H39" stroke="#9fea6e" stroke-width="4"/><circle cx="39" r="9" fill="#9fea6e" stroke="white"/></g><circle r="40" stroke="transparent" stroke-width="22"/><text id="dialValue" y="5" text-anchor="middle" fill="white" stroke="#182018" stroke-width="3" paint-order="stroke" font-size="13"></text></g>
    </g></svg>
    <div class="dimensions" role="group" aria-label="View dimension"><button id="view2" aria-pressed="true">2D</button><button id="view3" aria-pressed="false">3D</button></div><button id="fullscreen" type="button" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="white" stroke-width="1.7"><defs><path id="cornerArrow" d="M10 10 L3 3 M3 8 V3 H8"/></defs><use href="#cornerArrow"/><use href="#cornerArrow" transform="rotate(90 12 12)"/><use href="#cornerArrow" transform="rotate(180 12 12)"/><use href="#cornerArrow" transform="rotate(270 12 12)"/></svg></button>
    <details class="palette"><summary aria-label="Laser colour" title="Laser colour"><span class="rainbowIcon" aria-hidden="true"></span></summary><div class="picker"><div class="wheel" aria-hidden="true"></div><label>Hue<input type="range" id="hue" min="0" max="359" value="355"></label><label>Saturation<input type="range" id="sat" min="0" max="100" value="80"></label><output id="colourValue"></output></div></details></div>
    <section class="controls" aria-label="Simulation controls">
      <output id="angle"></output>
      <button id="openTutorial" type="button"><svg class="bookIcon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 6 Q8 3 2 4 V19 Q8 18 12 21 Q17 18 22 19 V4 Q17 3 12 6 Z M12 6 V21"/></svg> Tutorial</button><details style="grid-column:1/-1"><summary>Fine adjustments</summary><label>Source X<input id="sx" type="range" min="62" max="578" value="270"></label>
      <label><span id="depthLabel">Source Y</span><input id="sy" type="range" min="62" max="298" value="280"></label>
      <label>Rotate source <output id="sourceAngle"></output><input id="rotation" type="range" min="-180" max="180" step="0.1" value="20"></label>
      <label>Rotate plane mirror <output id="tiltValue"></output><input id="tilt" type="range" min="-90" max="90" value="0"></label>
      <label>Mirror Y<input id="mirrorY" type="range" min="36" max="324" value="180"></label>
      <button id="secret" type="button" aria-label="Switch light source" aria-pressed="false">???</button></details><label>Mirror length<input id="mirrorLength" type="range" min="80" max="620" value="308"></label>
      <label id="pitchControl" hidden>Source pitch <output id="pitchValue"></output><input id="pitch" type="range" min="-85" max="85" step="0.1" value="0"></label><label id="sourceHeightControl" hidden>Source height (Y) <output id="sourceLevel"></output><input id="sourceHeight" type="range" min="0" max="150" value="30"></label><label id="heightControl" hidden>Mirror height <output id="mirrorLevel"></output><input id="mirrorHeight" type="range" min="10" max="150" value="65"></label>
      <button id="reset" type="button">Restore defaults</button>
    </section>
    <dialog id="tutorial" aria-labelledby="demoTitle"><h2 id="demoTitle"></h2>
      <svg id="demoPicture" viewBox="0 0 220 85" aria-label="A hand dragging the light source"><path d="M36 18 H184" stroke="#9bd8f0" stroke-width="4"/><g class="sourceSlide"><path d="M86 61 V20 V61" stroke="#ff717c"/><path d="M82 42 L86 35 L90 42 M82 47 L86 54 L90 47" fill="none" stroke="#ffb9b9" stroke-width="2"/><rect x="80" y="55" width="12" height="18" fill="#b8c6d6"/><path d="M91 76 L84 64 Q82 60 85 60 L90 65 V50 Q92 46 94 50 V60 Q105 58 109 65 L108 75 L103 80 H94 Z" fill="#ffe2ba" stroke="#765637"/></g></svg>
      <p id="demoText"></p><footer><button id="closeTutorial">Close</button><button id="nextTip">Next</button></footer></dialog>
  </main>
  <script>
    const slider = document.querySelector('#rotation');
    const simulation = document.querySelector('main');
    const lessons = [
      ['Move the source','Drag the light source with one finger. Watch where the beam hits the mirror as you move it sideways.'],
      ['Adjust the mirror','Drag the mirror up or down. Change Mirror length in the panel to catch a beam that just misses its edge.'],
      ['Rotate an object','Hold the source or mirror until the green handle appears. Drag around the circle to change its angle.'],
      ['Move the camera','Drag empty space to pan. Pinch to zoom and twist two fingers to rotate. With a mouse, scroll to zoom or Shift-drag to rotate.'],
      ['Explore the controls','Open the rainbow wheel to change the laser colour. The four-arrow button enters or exits full screen. Restore defaults returns the setup to its starting position.']
    ];
    const tutorial=document.querySelector('#tutorial');
    let lesson=0;
    const picture=document.querySelector('#demoPicture');
    const hand='<path fill="#ffe2ba" stroke="#765637" d="M1 18 L-6 7 Q-7 4 -4 4 L0 8 V-6 Q2 -10 4 -6 V2 Q14 0 16 7 L14 17 L10 21 H4 Z"/>';
    const mirror='<path d="M45 25 H175" stroke="#9bd8f0" stroke-width="4"/>';
    const lampDemo='<path d="M82 69 L110 27 L138 69" fill="none" stroke="#ff717c" stroke-width="2"/><rect x="76" y="62" width="12" height="14" fill="#b8c6d6"/>';
    const demos=[
      picture.innerHTML,
      '<g class="demoMirror">'+mirror+'<g transform="translate(133 25)">'+hand+'</g></g><path d="M60 70 H160" stroke="#627182" stroke-dasharray="3 4"/>',
      '<circle cx="110" cy="43" r="28" fill="none" stroke="#8ed275"/><g class="demoRotate"><path d="M110 43 H138" stroke="#9fea6e" stroke-width="4"/><circle cx="138" cy="43" r="6" fill="#9fea6e"/><g transform="translate(140 48)">'+hand+'</g></g>',
      '<svg x="40" y="6" width="140" height="73" viewBox="40 6 140 73"><g class="demoCamera">'+mirror+lampDemo+'</g></svg><rect x="40" y="6" width="140" height="73" fill="none" stroke="#438dff"/><g class="demoMove"><g transform="translate(60 50)">'+hand+'</g></g>',
      '<g class="demoColour"><path d="M58 69 L110 27 L162 69" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="184" cy="58" r="9" fill="none" stroke="currentColor" stroke-width="5"/></g>'+mirror+'<g transform="translate(187 65)">'+hand+'</g>'
    ];
    function showLesson(){
      document.querySelector('#demoTitle').textContent=lessons[lesson][0];
      document.querySelector('#demoText').textContent=lessons[lesson][1];
      picture.innerHTML=demos[lesson]; picture.setAttribute('aria-label',lessons[lesson][0]+' demonstration');
      document.querySelector('#nextTip').textContent=lesson===lessons.length-1?'Done':'Next';
    }
    document.querySelector('#openTutorial').onclick=()=>{lesson=0;showLesson();tutorial.showModal()};
    document.querySelector('#closeTutorial').onclick=()=>tutorial.close();
    document.querySelector('#nextTip').onclick=()=>{if(++lesson===lessons.length)tutorial.close();else showLesson()};
    const fullButton = document.querySelector('#fullscreen');
    function syncFullscreen() {
      const expanded = Boolean(document.fullscreenElement || simulation.classList.contains('expanded'));
      fullButton.title = expanded ? 'Exit full screen' : 'Full screen';
      fullButton.setAttribute('aria-label',fullButton.title);
      document.querySelector('#cornerArrow').setAttribute('d',expanded?'M3 3 L10 10 M5 10 H10 V5':'M10 10 L3 3 M3 8 V3 H8');
    }
    fullButton.onclick = async () => {
      if (document.fullscreenElement) await document.exitFullscreen();
      else if (simulation.classList.contains('expanded')) simulation.classList.remove('expanded');
      else {
        try { await simulation.requestFullscreen(); }
        catch { simulation.classList.add('expanded'); }
      }
      syncFullscreen();
    };
    document.addEventListener('fullscreenchange', syncFullscreen);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { simulation.classList.remove('expanded'); syncFullscreen(); }
    });
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    // Two-degree divisions span 1 mm of arc at the nominal 640 CSS pixel width.
    const radius = (96 / 25.4) / (2 * Math.PI / 180);
    const meter = document.querySelector('#meter');
    for (let angle = -90; angle <= 90; angle++) {
      if (angle % 2 !== 0 && angle % 5 !== 0) continue;
      const rad = angle * Math.PI / 180;
      const point = r => [320 + r * Math.sin(rad), 56 + r * Math.cos(rad)];
      const tick = document.createElementNS(meter.namespaceURI, 'path');
      tick.setAttribute('d', 'M' + point(radius) + ' L' + point(radius - (angle % 10 === 0 ? 8 : 4)));
      tick.setAttribute('stroke', '#8595a7');
      meter.append(tick);
      if (angle % 10 === 0) {
        const label = document.createElementNS(meter.namespaceURI, 'text');
        const [x, y] = point(radius + 12);
        label.setAttribute('x', x);
        label.setAttribute('y', y + (Math.abs(angle) === 90 ? -6 : 3));
        label.textContent = Math.abs(angle) + '°';
        meter.append(label);
      }
    }
    const layer = document.querySelector('#arrows');
    const arrows = Array.from({length: 2}, () => Array.from({length: 3}, () => {
      const arrow = document.createElementNS(layer.namespaceURI, 'path');
      arrow.setAttribute('d', 'M6 0 L-5 -4 L-3 0 L-5 4 Z');
      layer.append(arrow);
      return arrow;
    }));
    let rays = [];
    let frame;
    function animate(time) {
      if (byId('secret').getAttribute('aria-pressed') === 'true') {
        const phase = motion.matches ? 0 : time * .005;
        const strands = [];
        for (const [x,y,dx,dy] of rays) {
          const length = Math.hypot(dx,dy);
          if (length < 1) continue;
          const steps = Math.max(2,Math.ceil(length/5));
          for (let k=0;k<=steps;k++) {
            const t=k/steps, s=t*length;
            const bend=Math.sin(Math.PI*t)*(2.5*Math.sin(s*.24-phase)+1.1*Math.sin(s*.69+phase*1.6));
            strands.push((k?'L':'M')+(x+dx*t-dy*bend/length).toFixed(2)+' '+(y+dy*t+dx*bend/length).toFixed(2));
          }
        }
        byId('filament').setAttribute('d',strands.join(' '));
      }
      rays.forEach(([x, y, dx, dy], rayIndex) => {
        arrows[rayIndex].forEach((arrow, index) => {
          const age = ((motion.matches ? 500 : time) + index * 1000) % 3000;
          const fraction = age / 3000;
          arrow.setAttribute('opacity', Math.min(1, age / 100, (3000 - age) / 100));
          arrow.setAttribute('transform', `translate(${x + dx * fraction} ${y + dy * fraction}) rotate(${Math.atan2(dy, dx) * 180 / Math.PI})`);
        });
      });
      const glow = motion.matches ? 0.65 : 0.60 - 0.38 * Math.cos(time * Math.PI / 2100);
      document.querySelector('#halo').setAttribute('opacity', glow);
      if (!motion.matches) frame = requestAnimationFrame(animate);
    }
    const byId = id => document.getElementById(id);
    function edge(x, y, dx, dy) {
      const horizontal = dx > 0 ? (640-x)/dx : dx < 0 ? -x/dx : Infinity;
      const vertical = dy > 0 ? (360-y)/dy : dy < 0 ? -y/dy : Infinity;
      return Math.min(horizontal, vertical);
    }
    let spatial=false;
    const floorProjection=new DOMMatrix([.94,.28,-.34,.64,80,-18]);
    const planeMatrix=()=>spatial?floorProjection:new DOMMatrix();
    function elevation(z=+byId('mirrorHeight').value){

      return new DOMPoint(0,-z,0,0).matrixTransform(floorProjection.inverse());
    }
    function switchView(value){
      spatial=value;
      byId('view2').setAttribute('aria-pressed',String(!value));
      byId('view3').setAttribute('aria-pressed',String(value));
      byId('pitchControl').hidden=!value; byId('heightControl').hidden=!value; byId('sourceHeightControl').hidden=!value;
      draw();
    }
    byId('view2').onclick=()=>switchView(false);
    byId('view3').onclick=()=>switchView(true);
    function draw() {
      const x = +byId('sx').value, y = +byId('sy').value;
      const degrees = +slider.value, tilt = +byId('tilt').value;
      const rad = Math.PI / 180;
      const dx = Math.sin(degrees*rad), dy = -Math.cos(degrees*rad);
      const nx = -Math.sin(tilt*rad), ny = Math.cos(tilt*rad);
      const dot = dx*nx + dy*ny;
      const mirrorY = +byId('mirrorY').value;
      const halfLength = +byId('mirrorLength').value / 2;
      byId('mirror').setAttribute('d','M'+(320-halfLength)+' 180 H'+(320+halfLength));
      const left=[320-halfLength*ny,mirrorY+halfLength*nx];
      const right=[320+halfLength*ny,mirrorY-halfLength*nx];
      const level=+byId('sourceHeight').value, ceiling=+byId('mirrorHeight').value;
      const pitch=+byId('pitch').value*rad;
      const slope=Math.tan(pitch);
      byId('pitchValue').textContent=(pitch/rad).toFixed(1)+'°';
      const offset=elevation(spatial?level:0);
      byId('opticalPlane').setAttribute('transform','translate('+offset.x+' '+offset.y+')');
      byId('sourceLevel').textContent=level; byId('mirrorLevel').textContent=ceiling;
      byId('depthLabel').textContent=spatial?'Source depth (Z)':'Source Y';
      const palm=byId('gauntlet');
      const palmUp=elevation(1), localRotation=new DOMMatrix().rotate(-degrees);
      const rise=elevation(spatial?Math.sin(pitch):0).matrixTransform(localRotation);
      byId('standardSource').setAttribute('transform',spatial?'matrix(1 0 '+(-rise.x)+' '+(Math.cos(pitch)-rise.y)+' 0 0)':'translate(0 0)');
      const tangent=new DOMPoint(ny,-nx,0,0).matrixTransform(localRotation);
      const vertical=palmUp.matrixTransform(localRotation);
      palm.setAttribute('transform',spatial?'matrix('+[tangent.x,tangent.y,-vertical.x,-vertical.y,0,0].join(' ')+')':'translate(0 0)');
      const depth=byId('sourceDepth');
      depth.style.display=spatial?'':'none';
      if(spatial){
        const local=(byId('secret').getAttribute('aria-pressed')==='true'?new DOMPoint(nx,ny,0,0):elevation(-1)).matrixTransform(localRotation);
        if(!depth.childElementCount){
          for(let n=8;n>=1;n--){const slice=document.createElementNS(depth.namespaceURI,'use');depth.append(slice);}
        }
        const shape=byId('secret').getAttribute('aria-pressed')==='true'?'#gauntlet':'#standardSource';
        [...depth.children].forEach((slice,index)=>{
          slice.setAttribute('href',shape);
          slice.setAttribute('transform','translate('+local.x*(8-index)+' '+local.y*(8-index)+')');
        });
      }
      const up=elevation();
      byId('mirrorFace').setAttribute('d',spatial?'M'+left+' L'+right+' l'+up.x+' '+up.y+' L'+(left[0]+up.x)+' '+(left[1]+up.y)+' Z':'');
      byId('sourceAngle').textContent = degrees.toFixed(1)+'°';
      byId('topGrip').setAttribute('d',spatial?'M'+(left[0]+up.x)+' '+(left[1]+up.y)+' L'+(right[0]+up.x)+' '+(right[1]+up.y):'');
      const halfThickness = Number(byId('mirror').getAttribute('stroke-width')) / 2;
      const normalOffset = (x-320)*nx + (y-mirrorY)*ny;
      const along = (x-320)*ny - (y-mirrorY)*nx;
      const inside = level<=ceiling && Math.abs(normalOffset)<halfThickness && Math.abs(along)<=halfLength;
      const distance = Math.abs(dot)>1e-9 ? (-Math.sign(dot)*halfThickness-normalOffset)/dot : Infinity;
      const contactHeight=level+distance*slope;
      const floorLimit=slope<0 ? -level/slope : Infinity;
      const hit = contactHeight>=-1e-6 && contactHeight<=ceiling+1e-6 && !inside && distance >= 0 && Number.isFinite(distance) &&
        distance <= edge(x,y,dx,dy) &&
        Math.abs((x+distance*dx-320)*ny - (y+distance*dy-mirrorY)*nx) <= halfLength+1e-6;
      const length = inside ? 0 : hit ? distance : Math.min(floorLimit,edge(x,y,dx,dy));
      const hx = x+dx*length, hy = y+dy*length;
      byId('mirror').setAttribute('transform', 'translate(0 '+(mirrorY-180)+') rotate('+tilt+' 320 180)');
      byId('tiltValue').textContent = tilt+'°';
      byId('incident').setAttribute('d', 'M'+x+' '+y+' L'+hx+' '+hy);
      byId('lamp').setAttribute('transform','translate('+x+' '+y+') rotate('+degrees+')');
      rays = [[x,y,dx*length,dy*length]];
      byId('guide').style.display = hit ? '' : 'none';
      byId('outgoingLabel').style.display = hit ? '' : 'none';
      arrows[1].forEach(arrow => arrow.style.display = hit ? '' : 'none');
      byId('reflected').setAttribute('d','');
      function label(id, px, py) {
        byId(id).setAttribute('x', Math.max(52,Math.min(588,px)));
        byId(id).setAttribute('y', Math.max(18,Math.min(350,py)));
      }
      label('incomingLabel',x+dx*length*.35-48,y+dy*length*.35);
      if (hit) {
        const rx = dx-2*dot*nx, ry = dy-2*dot*ny;
        const reach = Math.min(edge(hx,hy,rx,ry),slope<0 ? Math.max(0,-contactHeight/slope) : Infinity);
        rays.push([hx,hy,rx*reach,ry*reach]);
        byId('reflected').setAttribute('d','M'+hx+' '+hy+' l'+rx*reach+' '+ry*reach);
        byId('guide').setAttribute('transform','translate('+hx+' '+hy+') rotate('+(tilt+(dot>0?180:0))+') scale(.97) translate(-320 -56)');
        label('outgoingLabel',hx+rx*reach*.62+48,hy+ry*reach*.62);
        const angle = cosine => (Math.acos(Math.min(1,Math.abs(cosine)*Math.cos(pitch)))/rad).toFixed(1);
        byId('angle').textContent = 'Incidence i = '+angle(dot)+'° · Reflection r = '+angle(rx*nx+ry*ny)+'°';
      } else {
        byId('angle').textContent = inside ? 'Move the source outside the mirror' : contactHeight>ceiling && distance>0 ? 'Beam passes above the mirror' : 'Beam misses the mirror';
      }
      updateDial();
      applyCamera();
      const segments=rays.map(([ax,ay,vx,vy])=>'M'+ax+' '+ay+' l'+vx+' '+vy);
      byId('floorTrace').setAttribute('d',spatial?segments.join(' '):'');
      let travelled=0;
      const guides=[];
      for(let i=0;i<rays.length;i++){
        const [ax,ay,vx,vy]=rays[i];
        const startLift=elevation(spatial?travelled*slope:0);
        travelled+=Math.hypot(vx,vy);
        const endLift=elevation(spatial?travelled*slope:0);
        const a=ax+startLift.x,b=ay+startLift.y,c=ax+vx+endLift.x,d=ay+vy+endLift.y;
        rays[i]=[a,b,c-a,d-b];
        byId(i?'reflected':'incident').setAttribute('d','M'+a+' '+b+' L'+c+' '+d);
        guides.push('M'+(ax+vx)+' '+(ay+vy)+' L'+(c+offset.x)+' '+(d+offset.y));
        label(i?'outgoingLabel':'incomingLabel',(a+c)/2+(i?48:-48),(b+d)/2);
        if(i===0 && hit)byId('guide').setAttribute('transform','translate('+c+' '+d+') rotate('+(tilt+(dot>0?180:0))+') scale(.97) translate(-320 -56)');
      }
      byId('meter').style.visibility=Math.abs(pitch)>1e-9?'hidden':'visible';
      byId('heightEdges').setAttribute('d',spatial?guides.join(' '):'');
      cancelAnimationFrame(frame);
      animate(performance.now());
    }
    document.querySelectorAll('input').forEach(input => input.addEventListener('input',draw));
    byId('reset').addEventListener('click', () => {
      camera = initialCamera(); applyCamera(); setGlove(false); byId('hue').value=355; byId('sat').value=80; paint(); selected = null;
      for (const input of document.querySelectorAll('.controls input')) input.value = input.defaultValue;
      draw();
    });
    const lamp = byId('lamp');
    const svg = lamp.ownerSVGElement;
    const screenPoint = event => new DOMPoint(event.clientX,event.clientY).matrixTransform(svg.getScreenCTM().inverse());
    const pointer = event => screenPoint(event).matrixTransform(camera.multiply(planeMatrix()).inverse());
    const dial = byId('dial');
    let selected = null, drag, holdTimer;
    function centre(target) {
      return target === 'lamp' ? [+byId('sx').value,+byId('sy').value] : [320,+byId('mirrorY').value];
    }
    function updateDial() {
      const hit = byId('mirrorTouch');
      hit.setAttribute('d',byId('mirror').getAttribute('d'));
      hit.setAttribute('transform',byId('mirror').getAttribute('transform'));
      dial.setAttribute('display',selected ? 'inline' : 'none');
      if (!selected) return;
      const [baseX,baseY] = centre(selected); const offset=elevation(spatial && selected==='lamp'?+byId('sourceHeight').value:0); const x=baseX+offset.x,y=baseY+offset.y;
      const source = selected === 'lamp';
      const angle = +(source ? slider : byId('tilt')).value;
      dial.setAttribute('transform','translate('+x+' '+y+')');
      byId('arm').setAttribute('transform','rotate('+(angle-(source?90:0))+')');
      byId('dialValue').textContent=angle.toFixed(source?1:0)+'°';
    }
    svg.addEventListener('pointerdown', event => {
      if (drag || fingers.size) return;
      const rotating = dial.contains(event.target);
      const target = rotating ? selected : lamp.contains(event.target) ? 'lamp' : event.target.id==='topGrip' ? 'height' : event.target.id==='mirrorTouch' ? 'mirror' : null;
      if (!rotating) selected=null;
      updateDial();
      if (!target) return;
      event.preventDefault();
      const p=pointer(event);
      drag={id:event.pointerId,target,p,origin:centre(target),rotating,level:+byId(target==="height"?"mirrorHeight":"sourceHeight").value};
      svg.setPointerCapture(event.pointerId);
      if (!rotating && target!=="height") holdTimer=setTimeout(()=>{
        if (!drag) return;
        selected=target; drag.rotating=true; updateDial();
      },380);
    });
    svg.addEventListener('pointermove',event=>{
      if (drag?.id!==event.pointerId) return;
      const p=pointer(event), [x,y]=drag.origin;
      const dx=p.x-drag.p.x, dy=p.y-drag.p.y;
      if (drag.rotating) {
        if (Math.hypot(p.x-x,p.y-y)<12) return;
        const source=drag.target==='lamp';
        const offset=elevation(spatial && source?+byId('sourceHeight').value:0); let angle=Math.atan2(p.y-y-offset.y,p.x-x-offset.x)*180/Math.PI+(source?90:0);
        if(angle>180) angle-=360;
        (source?slider:byId('tilt')).value=angle;
      } else {
        if(!drag.moved && Math.hypot(dx,dy)<4) return;
        drag.moved=true; clearTimeout(holdTimer);
        if(spatial && (drag.target==='lamp'||drag.target==='height')){
          const movement=new DOMPoint(dx,dy,0,0).matrixTransform(floorProjection);
          if(drag.target==='height') byId('mirrorHeight').value=drag.level-movement.y;
          else {
            const floorX=movement.x/floorProjection.a;
            byId('sx').value=x+floorX;
            byId('sourceHeight').value=drag.level+floorProjection.b*floorX-movement.y;
          }
          draw(); return;
        }
        if(drag.target==='lamp') byId('sx').value=x+dx;
        byId(drag.target==='lamp'?'sy':'mirrorY').value=y+dy;
      }
      draw();
    });
    svg.addEventListener('lostpointercapture',()=>{clearTimeout(holdTimer);drag=null;});
    const world=byId('world'), fingers=new Map();
    const minZoom=1.23;
    function initialCamera(){return new DOMMatrix().translate(324,90).scale(minZoom).translate(-320,-180);}
    let camera=initialCamera(); applyCamera(); new ResizeObserver(applyCamera).observe(svg);
    function setGlove(active){
      byId('filament').setAttribute('display',active?'inline':'none');
      byId("gauntlet").setAttribute("display",active?"inline":"none");
      byId("standardSource").setAttribute("display",active?"none":"inline");
      byId("secret").setAttribute("aria-pressed",String(active));
      draw();
    }
    byId("secret").onclick=()=>setGlove(byId("secret").getAttribute("aria-pressed")!=="true");
    function applyCamera(){
      const box=svg.getBoundingClientRect();
      if(!box.width||!box.height)return;
      const inv=svg.getScreenCTM().inverse();
      const lo=new DOMPoint(box.left+5,box.top+5).matrixTransform(inv);
      const hi=new DOMPoint(box.right-5,box.bottom-5).matrixTransform(inv);
      const points=[];
      for(const [id,angle] of [['lamp',+slider.value],['mirror',+byId('tilt').value]]){
        const [x,y]=centre(id), length=+byId('mirrorLength').value/2;
        const base=camera.multiply(planeMatrix()); const lift=elevation(spatial && id==='lamp'?+byId('sourceHeight').value:0); const transform=base.translate(x+lift.x,y+lift.y).rotate(angle);
        const bounds=id==='lamp'?[-18,18,-28,26]:[-length,length,-3,3];
        for(const px of bounds.slice(0,2))for(const py of bounds.slice(2)){const corner=new DOMPoint(px,py).matrixTransform(transform);points.push(corner);if(spatial && id==="mirror"){const up=elevation().matrixTransform(base);points.push(new DOMPoint(corner.x+up.x,corner.y+up.y));}}
      }
      const xs=points.map(p=>p.x),ys=points.map(p=>p.y);
      const left=Math.min(...xs),right=Math.max(...xs),top=Math.min(...ys),bottom=Math.max(...ys);
      const fit=Math.min(1,(hi.x-lo.x)/(right-left),(hi.y-lo.y)/(bottom-top));
      const tx=Math.max(lo.x-left*fit,Math.min(0,hi.x-right*fit));
      const ty=Math.max(lo.y-top*fit,Math.min(0,hi.y-bottom*fit));
      camera=new DOMMatrix().translate(tx,ty).scale(fit).multiply(camera);
      world.setAttribute('transform',camera.multiply(planeMatrix()).toString().replace(/,/g,' '));
    }
    function transformView(from,to,angle,ratio){
      const scale=Math.hypot(camera.a,camera.b);
      ratio=Math.min(6,Math.max(minZoom,scale*ratio))/scale;
      camera=new DOMMatrix().translate(to.x,to.y).rotate(angle).scale(ratio).translate(-from.x,-from.y).multiply(camera);
      applyCamera();
    }
    svg.addEventListener('pointerdown',e=>{
      if(drag || fingers.size>=2) return;
      fingers.set(e.pointerId,screenPoint(e)); svg.setPointerCapture(e.pointerId);
    });
    svg.addEventListener('pointermove',e=>{
      if(!fingers.has(e.pointerId)) return;
      const old=fingers.get(e.pointerId), next=screenPoint(e);
      fingers.set(e.pointerId,next);
      const other=[...fingers].find(([id])=>id!==e.pointerId)?.[1];
      if(other){
        const length=p=>Math.hypot(p.x-other.x,p.y-other.y);
        const angle=p=>Math.atan2(p.y-other.y,p.x-other.x)*180/Math.PI;
        if(length(old)>0.1 && length(next)>0.1) transformView(other,other,angle(next)-angle(old),length(next)/length(old));
      }else if(e.shiftKey){transformView({x:320,y:180},{x:320,y:180},(next.x-old.x)*0.5,1);}
      else transformView(old,next,0,1);
    });
    svg.addEventListener('lostpointercapture',e=>fingers.delete(e.pointerId));
    svg.addEventListener('wheel',e=>{
      e.preventDefault();const p=screenPoint(e);transformView(p,p,0,Math.exp(-e.deltaY*.002));
    },{passive:false});
    function paint(){
      const h=+byId('hue').value,s=+byId('sat').value/100;
      const channel=n=>{const k=(n+h/60)%6;return Math.round(255*(1-s*Math.max(0,Math.min(k,4-k,1))));};
      const rgb=[channel(5),channel(3),channel(1)];
      const hex='#'+rgb.map(c=>c.toString(16).padStart(2,'0')).join('').toUpperCase();
      byId('filament').setAttribute('stroke',hex);
      byId('incident').parentElement.setAttribute('stroke',hex);
      byId('core').setAttribute('fill',hex); byId('core').style.filter='drop-shadow(0 0 2px '+hex+')'; byId('halo').setAttribute('stroke',hex);byId('arrows').setAttribute('fill',hex);
      byId('colourValue').textContent='RGB '+rgb.join(', ')+' · '+hex;
    }
    for(const id of ['hue','sat']) byId(id).addEventListener('input',paint);
    const wheel=document.querySelector('.wheel');
    function pick(e){
      const r=wheel.getBoundingClientRect(), dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;
      byId('hue').value=(Math.atan2(dx,-dy)*180/Math.PI+360)%360;paint();
    }
    wheel.onpointerdown=e=>{wheel.setPointerCapture(e.pointerId);pick(e)};
    wheel.onpointermove=e=>{if(wheel.hasPointerCapture(e.pointerId))pick(e)};
    paint();
    motion.addEventListener('change', draw);
    draw();
  </script>
</body>
</html>
