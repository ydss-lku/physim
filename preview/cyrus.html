<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyrus</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #090c12;
    }
    main {
      width: min(100vw, calc(100dvh * 16 / 9));
      aspect-ratio: 16 / 9;
      display: grid;
      place-items: center;
      background: #151b25;
    }
    .frame {
      box-sizing: border-box;
      width: 90%;
      aspect-ratio: 16 / 9;
      border: 2px solid #438dff;
    }
  </style>
</head>
<body>
  <main aria-label="Simulation area">
    <div class="frame" aria-hidden="true"></div>
  </main>
</body>
</html>
