<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyrus</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #090c12;
    }
    main {
      width: min(100vw, calc(100dvh * 16 / 9));
      aspect-ratio: 16 / 9;
      display: grid;
      place-items: center;
      background: #151b25;
    }
    .frame {
      display: block;
      background: #05070b;
      color: #e8eef7;
      font: 15px system-ui, sans-serif;
      box-sizing: border-box;
      width: 90%;
      aspect-ratio: 16 / 9;
      border: 2px solid #438dff;
    }
  </style>
</head>
<body>
  <main aria-label="Simulation area">
    <svg class="frame" viewBox="0 0 640 360" aria-label="Reflection at a plane mirror">
      <defs>
        <filter id="rayGlow" filterUnits="userSpaceOnUse" x="0" y="0" width="640" height="360">
          <feGaussianBlur stdDeviation="5"/>
        </filter>
      </defs>
      <g fill="currentColor" text-anchor="middle">
        <text x="320" y="32">Plane mirror</text>
        <g id="meter" fill="#a2b2c4" font-size="10" aria-label="Protractor, zero at the normal"></g>
        <path d="M55 53 H585" stroke="#9bd8f0" stroke-width="5"/>
        <path d="M320 56 V263" stroke="#abbaca" stroke-dasharray="7 5"/>
        <text x="320" y="283">Normal</text>
        <g fill="none" stroke="#ff334b" stroke-width="14" filter="url(#rayGlow)" id="halo">
          <use href="#incident"/><use href="#reflected"/>
        </g>
        <g fill="none" stroke="#ff858a" stroke-width="2">
          <path id="incident"/><path id="reflected"/>
        </g>
        <g fill="#ffc2bf">
          <path id="inArrow" d="M7 0 L-6 -5 L-3 0 L-6 5 Z"/>
          <path id="outArrow" d="M7 0 L-6 -5 L-3 0 L-6 5 Z"/>
          <path id="nearArrow" d="M7 0 L-6 -5 L-3 0 L-6 5 Z"/>
        </g>
        <g id="lamp"><rect x="-10" y="-3" width="20" height="27" rx="4" fill="#b8c6d6"/><path d="M-9 -3 H9" stroke="#fff0b8" stroke-width="4"/></g>
        <text id="incomingLabel">Incident ray</text>
        <text id="outgoingLabel">Reflected ray</text>
      </g>
      <foreignObject x="80" y="293" width="480" height="64">
        <label style="display:grid;text-align:center">Rotate source · Angles to normal <output id="angle"></output>
          <input id="rotation" aria-label="Rotate source across the normal" type="range" min="-89.9" max="89.9" step="0.1" value="0" style="width:100%;margin:0;accent-color:#6aaaff">
        </label>
      </foreignObject>
    </svg>
  </main>
  <script>
    const slider = document.querySelector('#rotation');
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    // Two-degree divisions span 1 mm of arc at the nominal 640 CSS pixel width.
    const radius = (96 / 25.4) / (2 * Math.PI / 180);
    const meter = document.querySelector('#meter');
    for (let angle = -90; angle <= 90; angle += 2) {
      const rad = angle * Math.PI / 180;
      const point = r => [320 + r * Math.sin(rad), 56 + r * Math.cos(rad)];
      const tick = document.createElementNS(meter.namespaceURI, 'path');
      tick.setAttribute('d', 'M' + point(radius) + ' L' + point(radius - (angle % 10 === 0 ? 8 : 4)));
      tick.setAttribute('stroke', '#8595a7');
      meter.append(tick);
      if (angle % 30 === 0) {
        const label = document.createElementNS(meter.namespaceURI, 'text');
        const [x, y] = point(radius + 12);
        label.setAttribute('x', x);
        label.setAttribute('y', y + (Math.abs(angle) === 90 ? 13 : 3));
        label.textContent = Math.abs(angle) + '°';
        meter.append(label);
      }
    }
    let rays = [];
    let frame;
    function animate(time) {
      const phase = motion.matches ? 0.5 : time % 1700 / 1700;
      const fraction = 0.5 + 0.42 * phase;
      for (const [arrow, x, y, dx, dy] of rays) {
        arrow.setAttribute('transform', `translate(${x + dx * fraction} ${y + dy * fraction}) rotate(${Math.atan2(dy, dx) * 180 / Math.PI})`);
      }
      const glow = motion.matches ? 0.65 : 0.60 - 0.38 * Math.cos(time * Math.PI / 2100);
      document.querySelector('#halo').setAttribute('opacity', glow);
      if (!motion.matches) frame = requestAnimationFrame(animate);
    }
    function draw() {
      const degrees = Number(slider.value);
      const radians = degrees * Math.PI / 180;
      const dx = 176 * Math.sin(radians);
      const dy = 176 * Math.cos(radians);
      const x = 320 - dx;
      const y = 56 + dy;
      document.querySelector('#incident').setAttribute('d', `M ${x} ${y} l ${dx / 2} ${-dy / 2} L 320 56`);
      const reach = Math.min(232 / Math.cos(radians), 314 / Math.abs(Math.sin(radians)));
      const rx = reach * Math.sin(radians);
      const ry = reach * Math.cos(radians);
      rays = [[document.querySelector('#inArrow'), x, y, dx, -dy],
              [document.querySelector('#outArrow'), 320, 56, rx, ry],
              [document.querySelector('#nearArrow'), 320, 56, rx * 0.47, ry * 0.47]];
      document.querySelector('#reflected').setAttribute('d', `M 320 56 l ${rx * 0.7} ${ry * 0.7} L ${320 + rx} ${56 + ry}`);
      const side = degrees < 0 ? -1 : 1;
      const offset = Math.max(58, Math.abs(dx) * 0.6 + 40);
      for (const [id, sign] of [['#incomingLabel', -1], ['#outgoingLabel', 1]]) {
        const label = document.querySelector(id);
        label.setAttribute('x', 320 + sign * side * Math.max(165, offset));
        label.setAttribute('y', 80 + dy * 0.62);
      }
      document.querySelector('#lamp').setAttribute('transform', `translate(${x} ${y}) rotate(${degrees})`);
      const i = Math.abs(degrees).toFixed(1);
      const r = (Math.atan2(Math.abs(rx), ry) * 180 / Math.PI).toFixed(1);
      document.querySelector('#angle').textContent = `Incidence i = ${i}°　·　Reflection r = ${r}°`;
      cancelAnimationFrame(frame);
      animate(performance.now());
    }
    slider.addEventListener('input', draw);
    motion.addEventListener('change', draw);
    draw();
  </script>
</body>
</html>
