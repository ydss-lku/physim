</main><script id="distillation-renderer">function createDistillationRenderer(canvas){
'use strict';
const ctx=canvas.getContext('2d');
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,ease=v=>{v=clamp(v);return v*v*(3-2*v)},add=(a,b)=>a.map((v,i)=>v+b[i]),sub=(a,b)=>a.map((v,i)=>v-b[i]),mul=(a,k)=>a.map(v=>v*k),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],unit=a=>mul(a,1/(Math.hypot(...a)||1));
let progress=0,yaw=-.18,pitch=.30,gaming=false,labels=true,width=1000,height=560;
const meshes=[],outlines=[],N=32,TRIPOD_Z=-22;
const materials={glass:{rgb:[116,173,181],alpha:.10},water:{rgb:[65,177,211],alpha:.29},metal:{rgb:[113,133,141],alpha:1},rubber:{rgb:[53,60,59],alpha:1},ceramic:{rgb:[221,215,193],alpha:1},hose:{rgb:[180,79,56],alpha:1},mercury:{rgb:[183,73,60],alpha:1}};
function mesh(name,material,group='vessels'){const m={name,material,group,faces:[],edges:[],section:[],cuts:{}};meshes.push(m);return m}
function lathe(name,profile,origin,axis=[0,1,0],material='glass',group='vessels'){
 const m=mesh(name,material,group),v=unit(axis),u=unit(cross(v,Math.abs(v[2])<.9?[0,0,1]:[0,1,0])),w=unit(cross(u,v));
 const point=(r,h,a)=>add(origin,add(mul(v,h),add(mul(u,r*Math.cos(a)),mul(w,r*Math.sin(a)))));
 for(let j=0;j<profile.length;j++){const a=profile[j],b=profile[(j+1)%profile.length];for(let i=0;i<N;i++){const q=(i+.25)*Math.PI*2/N,r=(i+1.25)*Math.PI*2/N;m.faces.push([point(a[0],a[1],q),point(b[0],b[1],q),point(b[0],b[1],r),point(a[0],a[1],r)])}}
 for(let j=0;j<profile.length;j++){const a=profile[j],b=profile[(j+1)%profile.length];if(Math.abs(a[1]-b[1])<.01&&Math.abs(a[0]-b[0])>.2){const r=Math.max(a[0],b[0]);m.edges.push(Array.from({length:N+1},(_,i)=>point(r,a[1],i*Math.PI*2/N)))}}
 return m;
}
function tube(name,points,r=6,wall=2,material='glass',group='vessels'){
 const m=mesh(name,material,group),rings=[];
 for(let j=0;j<points.length;j++){const v=unit(sub(points[Math.min(j+1,points.length-1)],points[Math.max(0,j-1)])),u=unit(cross(v,[0,0,1]));rings.push([r,Math.max(.1,r-wall)].map(rad=>Array.from({length:N},(_,i)=>add(points[j],add(mul(u,rad*Math.cos((i+.25)*2*Math.PI/N)),[0,0,rad*Math.sin((i+.25)*2*Math.PI/N)])))))}
 for(let j=0;j<points.length-1;j++)for(let side=0;side<2;side++)for(let i=0;i<N;i++)m.faces.push([rings[j][side][i],rings[j+1][side][i],rings[j+1][side][(i+1)%N],rings[j][side][(i+1)%N]]);
 for(const j of [0,points.length-1]){for(let i=0;i<N;i++)m.faces.push([rings[j][0][i],rings[j][0][(i+1)%N],rings[j][1][(i+1)%N],rings[j][1][i]]);m.edges.push([...rings[j][0],rings[j][0][0]])}return m;
}
function rod(name,a,b,r=4,group='supports',material='metal'){return lathe(name,[[0,0],[r,0],[r,Math.hypot(...sub(b,a))],[0,Math.hypot(...sub(b,a))]],a,sub(b,a),material,group)}
function box(name,x0,y0,z0,x1,y1,z1,material='metal',group='supports'){
 const m=mesh(name,material,group),v=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
 m.faces=[[0,3,2,1],[4,5,6,7],[0,1,5,4],[3,7,6,2],[0,4,7,3],[1,2,6,5]].map(f=>f.map(i=>v[i]));m.edges=m.faces.map(f=>[...f,f[0]]);return m;
}
// All coordinates are world-space millimetre-like units. Cutting never changes the meshes.
const flaskProfile=[[0,-57],[16,-55],[31,-48],[44,-36],[53,-20],[57,0],[54,20],[44,37],[27,50],[17,56],[15,67],[15,118],[12,118],[12,66],[14,54],[25,47],[41,34],[51,18],[54,0],[50,-19],[42,-34],[29,-45],[14,-52],[0,-54]];

lathe('Sea water',[[0,-53],[15,-51],[29,-44],[41,-33],[49,-18],[52,-5],[0,-5]],[-185,48,0],[0,1,0],'water');
lathe('Rubber stopper',[[3,145],[11,145],[16,172],[3,172]],[-185,0,0],[0,1,0],'rubber');
lathe('Thermometer',[[2.7,127],[3.5,131],[3,276],[1.4,276],[1.4,130],[0,127]],[-185,0,0]);
rod('Thermometer liquid',[-185,130,0],[-185,231,0],.9,'vessels','mercury');

const A=[-129,131,0],B=[138,35,0],axis=sub(B,A),L=Math.hypot(...axis),v=unit(axis);
tube('Side arm',[[-173,131,0],[-158,138,0],A],8,2);

lathe('Cooling water',[[9.8,26],[18.8,26],[18.8,L-27],[9.8,L-27]],A,axis,'water');
const portHigh=add(A,mul(v,42)),portLow=add(A,mul(v,L-40));
tube('Water outlet',[[portHigh[0],portHigh[1]+16,0],[portHigh[0]-3,portHigh[1]+32,0],[portHigh[0]-3,portHigh[1]+66,0]],6,1.6);
tube('Water inlet',[[portLow[0],portLow[1]-16,0],[portLow[0]+3,portLow[1]-32,0],[portLow[0]+3,portLow[1]-68,0]],6,1.6);
tube('Delivery tube',[B,[169,24,0],[196,14,0],[219,3,0],[230,-13,0],[232,-42,0],[232,-117,0]],7,1.8);
lathe('Receiving beaker',[[0,-188],[36,-188],[42,-183],[43,-174],[43,-92],[46,-88],[43,-87],[40,-92],[40,-174],[37,-184],[0,-184]],[232,0,0]);
lathe('Distilled water',[[0,-183],[36,-183],[39,-178],[39,-162],[0,-162]],[232,0,0],[0,1,0],'water');
// The tripod has a real separate plane through BOTH front-leg axes, z = -22.
const topY=-18,baseY=-196;
rod('Tripod left leg',[-246,baseY,TRIPOD_Z],[-225,topY,TRIPOD_Z],4,'tripod');
rod('Tripod right leg',[-124,baseY,TRIPOD_Z],[-145,topY,TRIPOD_Z],4,'tripod');
rod('Tripod rear leg',[-185,baseY,62],[-185,topY,42],4,'tripod');
rod('Tripod front rail',[-230,topY,TRIPOD_Z],[-140,topY,TRIPOD_Z],5,'tripod');
rod('Tripod rear left rail',[-230,topY,TRIPOD_Z],[-185,topY,42],5,'tripod');
rod('Tripod rear right rail',[-140,topY,TRIPOD_Z],[-185,topY,42],5,'tripod');
// Wire gauze is a thin lattice. Its crossing wires are separate from the support.
for(let i=-5;i<=5;i++){const o=i*10;rod('Wire gauze',[-240,-11,o],[-130,-11,o],.65,'vessels');rod('Wire gauze',[-185+o,-11,-55],[-185+o,-11,55],.65,'vessels')}
box('Gauze ceramic centre',-213,-10,-27,-157,-7,27,'ceramic','vessels');
box('Heat-proof mat',-265,-203,-72,-106,-198,72,'ceramic','vessels');
lathe('Bunsen burner base',[[0,-197],[29,-197],[29,-192],[22,-187],[11,-184],[0,-184]],[-185,0,0],[0,1,0],'metal');
