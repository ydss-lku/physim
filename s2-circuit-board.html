<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-en="Circuit workbench · S2 Science" data-zh="電路實驗板 · 中二科學">Circuit workbench · S2 Science</title>

<body>
<main id="bench-app">
<header class="mast"><div><div class="unit">S2 SCIENCE <span>/</span> UNIT 8</div><h1>Circuit workbench</h1></div>
<label class="preset"><span>Experiment</span><select id="preset"><option value="simple">Switch a bulb</option><option value="series">Two bulbs in series</option><option value="parallel">Two bulbs in parallel</option><option value="empty">Build your own circuit</option></select></label></header>
<section class="workbench" id="frame" aria-label="Circuit workbench">
<div class="workspace">
<div class="left"><div class="board-head"><h2>Patch board</h2><div class="seg" role="group" aria-label="Circuit view"><button id="real" aria-pressed="true">Board view</button><button id="diagram" aria-pressed="false">Circuit diagram</button></div></div>
<svg id="board" viewBox="0 0 640 394" role="group" aria-label="Circuit board. Choose a tool and then a slot between two terminals."></svg>
<div class="readout" aria-live="polite"><span id="indicator"></span><div><strong id="state"></strong></div><div class="counter"><b id="count"></b><span>Bulbs lit</span></div></div></div>
<aside class="rack"><h2>Tool tray</h2><div id="tools"></div><p class="instruction" id="hint" aria-live="polite"></p><div class="edit"><button type="button" id="undo" disabled>Undo</button><button type="button" id="reset">Reset</button></div></aside></div>
</section>
<footer data-author-credit><span class="credit-lockup"><span class="credit-mark" role="img" aria-label="YD Physics"></span>Designed by Mr. Lai Ka Chun (LKU) | CPCYDSS | GPT-6.2 Astra</span></footer>
</main>
